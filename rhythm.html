<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07131F">
<title>Rhythm</title>
<style>
  /* ---- Ink palette (Coincidental.StaffChat.Wpf / Ink.cs) ---- */
  :root {
    --bg:          #07131F;
    --surface:     #0F2234;
    --surface-alt: #172E42;
    --primary:     #00B6D5;
    --primary-dk:  #0091B0;
    --text:        #E8EFF4;
    --muted:       #869AAB;
    --border:      #203A50;
    --amber:       #F2C24B;
    --online:      #3DD598;
    --danger:      #FF6B83;
    --on-header:   #04202E;
    --send-grad:   linear-gradient(#10BDD8, #0083B0);
    /* native controls (time pickers, checkboxes) must follow the dark theme */
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    /* the margin is what gives the drop shadow room */
    padding: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }

  /* ---- the floating card ---- */
  .card {
    max-width: 560px;
    margin: 0 auto;
    height: calc(100dvh - 20px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 2px 24px rgba(0,0,0,0.34);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- header ---- */
  .hdr {
    background: var(--primary);
    border-radius: 11px 11px 0 0;
    padding: 9px 12px;
    display: flex;
    align-items: center;
    gap: 9px;
    color: #fff;
    flex: none;
  }
  .hdr-glyph { flex: none; color: #fff; display: grid; place-items: center; }
  .hdr-mid { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  .hdr-title { font-size: 13px; font-weight: 600; flex: none; }
  .hdr-status {
    font-size: 11px; opacity: 0.8; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .hdr-act {
    flex: none; color: #fff; opacity: 0.9; cursor: pointer;
    background: none; border: none; padding: 2px; display: grid; place-items: center;
    text-decoration: none;
  }
  .hdr-act:hover { opacity: 1; }

  /* ---- tabs ---- */
  nav.tabs {
    display: flex; gap: 20px; padding: 0 12px; flex: none;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  nav.tabs button {
    background: none; border: none; cursor: pointer; padding: 9px 0 10px;
    font: inherit; font-size: 12px; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  nav.tabs button[aria-selected="true"] {
    color: var(--text); border-bottom-color: var(--primary); font-weight: 600;
  }
  nav.tabs button:hover { color: var(--text); }

  /* ---- scrolling content ---- */
  .body { flex: 1; overflow-y: auto; padding: 10px 12px 6px; min-height: 0; }

  /* custom scrollbar: width 10, no arrows, thumb #869AAB .30 / .60 / .80, radius 3, margin 2 */
  .body { scrollbar-width: thin; scrollbar-color: rgba(134,154,171,0.30) transparent; }
  .body::-webkit-scrollbar { width: 10px; }
  .body::-webkit-scrollbar-track { background: transparent; }
  .body::-webkit-scrollbar-thumb {
    background: rgba(134,154,171,0.30); border-radius: 3px;
    border: 2px solid transparent; background-clip: padding-box; min-height: 28px;
  }
  .body::-webkit-scrollbar-thumb:hover {
    background: rgba(134,154,171,0.60); background-clip: padding-box;
  }
  .body::-webkit-scrollbar-thumb:active {
    background: rgba(134,154,171,0.80); background-clip: padding-box;
  }

  /* ---- the day spine ---- */
  .row {
    display: flex; align-items: flex-start; padding: 3px 0;
    background: transparent; border-radius: 6px; position: relative;
  }
  .row:hover { background: rgba(23,46,66,0.45); }
  .row .t {
    width: 42px; flex: none; text-align: right; padding: 5px 8px 0 0;
    font-variant-numeric: tabular-nums; font-size: 10px; color: var(--muted);
  }
  .row .rail { width: 20px; flex: none; position: relative; align-self: stretch; }
  .row .rail::before {
    content: ''; position: absolute; left: 9px; top: 0; bottom: 0;
    width: 1px; background: var(--border);
  }
  .row:first-child .rail::before { top: 12px; }
  .row:last-child .rail::before { bottom: calc(100% - 12px); }

  /* identity dot: colour from the name hash, state from fill */
  .dot {
    position: absolute; left: 5px; top: 8px; width: 8px; height: 8px;
    border-radius: 50%; background: transparent; z-index: 2;
    box-shadow: inset 0 0 0 1.5px var(--dot);
  }
  .dot.done { background: var(--dot); box-shadow: 0 0 0 3px rgba(61,213,152,0.20); }
  .dot.skipped { box-shadow: inset 0 0 0 1.5px var(--muted); opacity: 0.5; }
  .dot.small { width: 5px; height: 5px; left: 7px; top: 10px; background: var(--border); box-shadow: none; }

  .row .bd { flex: 1; padding: 4px 6px 4px 0; min-width: 0; }
  .row .lab { font-size: 13px; color: var(--text); }
  .row.ctx .lab { color: var(--muted); }
  .row .note { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .row .actual {
    font-size: 11px; color: var(--online); margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  .row .actual button {
    background: none; border: none; color: inherit; font: inherit;
    cursor: pointer; text-decoration: underline dotted; padding: 0;
  }

  /* ghost action, revealed on row hover */
  .ghost {
    flex: none; opacity: 0; transition: opacity 0.12s; background: none;
    border: none; color: var(--muted); cursor: pointer; border-radius: 6px;
    width: 30px; height: 28px; margin-top: 2px;
    display: grid; place-items: center;
  }
  .row:hover .ghost { opacity: 1; }
  .ghost:hover { color: var(--text); background: var(--surface-alt); }
  /* Nothing reveals a hover-only control on a touch screen, so leave it out. */
  @media (hover: none) { .ghost { opacity: 0.9; } }

  .ctl { flex: none; display: flex; gap: 5px; padding-top: 2px; }
  .ctl button {
    width: 30px; height: 28px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    display: grid; place-items: center;
  }
  .ctl button:hover { color: var(--text); border-color: var(--muted); }
  .ctl button[aria-pressed="true"] {
    background: rgba(61,213,152,0.14); border-color: var(--online); color: var(--online);
  }
  .ctl button.skip[aria-pressed="true"] {
    background: rgba(134,154,171,0.10); border-color: var(--muted); color: var(--muted);
  }

  .nowline { display: flex; align-items: center; height: 0; }
  .nowline .t {
    width: 42px; flex: none; text-align: right; padding-right: 8px;
    font-size: 10px; color: var(--amber); font-variant-numeric: tabular-nums;
  }
  .nowline .ln { flex: 1; height: 1px; background: var(--amber); opacity: 0.55; }

  /* ---- a day's notes ---- */
  .notes { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .notes-h { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .block-in {
    border-radius: 6px; padding: 8px 8px 6px;
    background: var(--surface-alt); border: 1px solid var(--border);
  }
  .block-in:focus-within { border-color: var(--muted); }
  .note-in {
    display: block; width: 100%; border: none; background: transparent; outline: none;
    resize: none; overflow-y: auto; font: inherit; font-size: 12px; line-height: 1.45;
    color: var(--text); min-height: 18px; max-height: 160px;
  }
  .note-in::placeholder { color: var(--muted); opacity: 0.7; }
  /* a day carrying a note is marked in the week grid */
  .wnote {
    margin: 6px auto 0; width: 10px; height: 7px; opacity: 0.55;
    border-top: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
  }

  /* ---- weekly tally ---- */
  .tally {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 11px; color: var(--muted);
  }
  .tally span { display: inline-flex; align-items: center; gap: 6px; }
  .pips { display: inline-flex; gap: 3px; }
  .pip { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.2px var(--border); }
  .pip.on { background: var(--online); box-shadow: none; }

  /* ---- week view ---- */
  .weekgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .wcol {
    background: var(--surface-alt); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 3px 10px; text-align: center; cursor: pointer;
  }
  .wcol:hover { border-color: var(--muted); }
  .wcol.today { border-color: var(--amber); }
  .wcol .wd { font-size: 10px; color: var(--muted); }
  .wcol .dm { font-size: 14px; margin-bottom: 8px; color: var(--text); }
  .wcol.maryam .dm { color: var(--primary); }
  .beads { display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 60px; }
  .bead { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.3px var(--border); }
  .bead.done { background: var(--online); box-shadow: none; }
  .bead.skipped { background: rgba(134,154,171,0.25); }

  /* ---- patterns ---- */
  .finding { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .finding:last-child { border-bottom: none; }
  .finding h3 { font-size: 13px; font-weight: 600; color: var(--primary); margin-bottom: 4px; }
  .finding p { font-size: 12px; color: var(--muted); }
  .finding .stat { color: var(--text); font-variant-numeric: tabular-nums; }
  /* long bodies render as a block, like a chat message block */
  .finding .block {
    margin-top: 6px; border-radius: 6px; padding: 8px; background: var(--surface-alt);
    border: 1px solid var(--border); font-size: 12px; color: var(--muted);
  }
  .finding .act {
    margin-top: 9px; font: inherit; font-size: 12px; cursor: pointer;
    padding: 6px 13px; border: 1px solid var(--primary); background: transparent;
    color: var(--primary); border-radius: 6px;
  }
  .finding .act:hover { background: var(--primary); color: var(--on-header); }

  .hist { margin-top: 22px; font-size: 11px; color: var(--muted); }
  .hist h3 { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .hist li { list-style: none; padding: 3px 0; }
  .empty { color: var(--muted); font-size: 12px; padding: 20px 0; }

  /* ---- plan editor ---- */
  .addbtn {
    font: inherit; font-size: 12px; cursor: pointer; margin-bottom: 14px;
    padding: 7px 14px; border: 1px solid var(--primary); background: transparent;
    color: var(--primary); border-radius: 6px;
  }
  .addbtn:hover { background: var(--primary); color: var(--on-header); }
  .ed {
    background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px;
    padding: 11px 12px; margin-bottom: 8px;
  }
  .ed-top { display: flex; gap: 10px; align-items: center; }
  .ed input.lab-in {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--text);
    background: transparent; border: none; border-bottom: 1px solid transparent; padding: 3px 0;
  }
  .ed input.lab-in:hover { border-bottom-color: var(--border); }
  .ed input.lab-in:focus { outline: none; border-bottom-color: var(--primary); }
  .ed .del {
    font: inherit; font-size: 11px; cursor: pointer; color: var(--muted);
    background: none; border: none; padding: 4px 2px;
  }
  .ed .del:hover { color: var(--danger); }
  .ed-line { display: flex; align-items: center; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .ed-lbl { font-size: 11px; color: var(--muted); }
  .ed input[type=time], .ed input[type=number] {
    font: inherit; font-size: 12px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 7px;
    font-variant-numeric: tabular-nums;
  }
  .ed input.dur-in { width: 66px; }
  .ed-days { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
  .ed-days .day {
    font: inherit; font-size: 11px; cursor: pointer; padding: 5px 0; width: 38px;
    border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 6px;
  }
  .ed-days .day.on {
    background: rgba(0,182,213,0.14); border-color: var(--primary); color: var(--primary);
  }
  .ed-track {
    display: flex; align-items: center; gap: 7px; margin-top: 10px;
    font-size: 11px; color: var(--muted); cursor: pointer;
  }
  .ed-track input { accent-color: var(--primary); }
  .ed.dim { opacity: 0.7; }
  .stale-toggle {
    display: block; width: 100%; margin: 2px 0 10px; padding: 8px;
    font: inherit; font-size: 11px; color: var(--muted); cursor: pointer;
    background: transparent; border: 1px dashed var(--border); border-radius: 6px;
  }
  .stale-toggle:hover { color: var(--text); border-color: var(--muted); }
  .edtip { margin-top: 14px; font-size: 11px; color: var(--muted); }

  .status { margin-top: 20px; font-size: 10px; color: var(--muted); }
  .status button {
    font: inherit; font-size: 10px; color: var(--muted); background: none;
    border: none; padding: 0 0 0 8px; cursor: pointer; text-decoration: underline dotted;
  }
  .status button:hover { color: var(--text); }

  /* ---- bottom action bar ---- */
  .bar {
    flex: none; background: var(--surface); border-top: 1px solid var(--border);
    border-radius: 0 0 11px 11px; padding: 10px 8px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .popwrap { position: relative; }
  .pill {
    display: flex; align-items: center; gap: 8px; width: 100%; height: 30px;
    padding: 0 8px; background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font: inherit; font-size: 12px; cursor: pointer;
  }
  .pill:hover { border-color: var(--muted); }
  .pill .pl { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill .pc { flex: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pill .cv { flex: none; color: var(--muted); display: grid; place-items: center; }
  .popup {
    position: absolute; bottom: calc(100% + 6px); left: 0; min-width: 200px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 6px; box-shadow: 0 4px 18px rgba(0,0,0,0.24); z-index: 30;
    animation: pop 0.12s ease-out;
  }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
  .popup button {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px;
    border-radius: 6px; background: transparent; border: none; color: var(--text);
    font: inherit; font-size: 12px; cursor: pointer; text-align: left;
  }
  .popup button:hover { background: var(--surface-alt); }
  .popup button.on { color: var(--primary); font-weight: 600; }
  .popup .pdot { width: 6px; height: 6px; border-radius: 50%; background: var(--online); flex: none; }

  .bar-row { display: flex; align-items: center; gap: 8px; }
  .btn-sec {
    width: 32px; height: 32px; flex: none; border-radius: 16px;
    background: var(--surface-alt); border: 1px solid var(--border);
    color: var(--muted); display: grid; place-items: center; cursor: pointer;
  }
  .btn-sec:hover { color: var(--text); border-color: var(--muted); }
  .btn-pri {
    width: 40px; height: 40px; flex: none; border-radius: 20px;
    background: var(--send-grad); border: none; color: #fff;
    display: grid; place-items: center; cursor: pointer;
  }
  .btn-pri:hover { filter: brightness(1.08); }
  .btn-pri.idle { opacity: 0.45; }
  /* the composer: a white card holding a borderless field */
  .composer {
    flex: 1; min-width: 0; background: #fff; border-radius: 8px; padding: 6px 9px;
  }
  .composer textarea {
    display: block; width: 100%; border: none; background: transparent; outline: none;
    resize: none; overflow-y: auto; font: inherit; font-size: 13px; line-height: 1.35;
    color: #14171C; min-height: 22px; max-height: 140px;
  }
  .composer textarea::placeholder { color: #8A9199; }

  .navrow { display: flex; align-items: center; gap: 4px; }
  .navrow .popwrap { flex: 1; min-width: 0; }
  .btn-nav {
    width: 26px; height: 30px; flex: none; background: none; border: none;
    border-radius: 6px; color: var(--muted); display: grid; place-items: center; cursor: pointer;
  }
  .btn-nav:hover { color: var(--text); background: var(--surface-alt); }

  /* ---- token modal ---- */
  #pat-modal {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(7,19,31,0.72); align-items: center; justify-content: center; padding: 20px;
  }
  #pat-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px; max-width: 340px; width: 100%; box-shadow: 0 2px 24px rgba(0,0,0,0.34);
  }
  #pat-title { font-size: 13px; font-weight: 600; }
  #pat-msg { color: var(--amber); font-size: 11px; margin-top: 4px; }
  #pat-input {
    width: 100%; font: inherit; font-size: 13px; margin-top: 12px; padding: 7px 9px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
  }
  #pat-hint { font-size: 11px; color: var(--muted); margin-top: 9px; line-height: 1.45; }
  #pat-save {
    font: inherit; font-size: 12px; cursor: pointer; margin-top: 14px;
    padding: 7px 14px; border: none; background: var(--send-grad);
    color: #fff; border-radius: 6px;
  }

  /* ---- dialog ---- */
  #dlg {
    position: fixed; inset: 0; z-index: 60; background: rgba(7,19,31,0.72);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #dlg[hidden] { display: none; }
  .dlg-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; max-width: 340px; width: 100%; box-shadow: 0 2px 24px rgba(0,0,0,0.34);
  }
  .dlg-title { font-size: 13px; font-weight: 600; }
  .dlg-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .dlg-sub:empty { display: none; }
  .dlg-input {
    width: 100%; font: inherit; font-size: 13px; margin-top: 12px; padding: 7px 9px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
  }
  .dlg-input[hidden] { display: none; }
  .dlg-actions { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
  .dlg-btn {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 12px;
    padding: 9px 10px; border-radius: 6px; background: transparent;
    border: 1px solid var(--border); color: var(--text); cursor: pointer;
  }
  .dlg-btn:hover { background: var(--surface-alt); border-color: var(--muted); }
  .dlg-btn.primary { background: var(--send-grad); border: none; color: #fff; text-align: center; }
  .dlg-btn.danger { color: var(--danger); }
  .dlg-btn.danger:hover { border-color: var(--danger); background: transparent; }
  .dlg-btn.quiet { border-color: transparent; color: var(--muted); text-align: center; }
  .dlg-btn.quiet:hover { color: var(--text); background: transparent; }

  /* an item taken off today: still there, plainly not being asked for */
  .row.na .lab { color: var(--muted); text-decoration: line-through; }
  .dot.na { box-shadow: inset 0 0 0 1.5px var(--border); opacity: 0.6; }
  .bead.na { opacity: 0.3; }

  button:focus-visible, [tabindex]:focus-visible, a:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  @media (max-width: 400px) {
    nav.tabs { gap: 14px; }
    .row .t, .nowline .t { width: 38px; }
  }
</style>
</head>
<body>

<div id="pat-modal">
  <div id="pat-box">
    <div id="pat-title">GitHub token</div>
    <div id="pat-msg"></div>
    <input id="pat-input" type="password" placeholder="ghp_&hellip;" autocomplete="off" spellcheck="false" />
    <div id="pat-hint">The same token the to-do list uses. Create one with <b>repo</b> scope at github.com/settings/tokens &mdash; set expiry to <b>No expiration</b>.</div>
    <button id="pat-save">Save token</button>
  </div>
</div>

<div id="dlg" hidden>
  <div class="dlg-box" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-title" id="dlgTitle"></div>
    <div class="dlg-sub" id="dlgSub"></div>
    <input class="dlg-input" id="dlgInput" hidden autocomplete="off" spellcheck="false" />
    <div class="dlg-actions" id="dlgActions"></div>
  </div>
</div>

<div class="card">

  <div class="hdr">
    <span class="hdr-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M8 14h3"/></svg></span>
    <div class="hdr-mid">
      <span class="hdr-title">Rhythm</span>
      <span class="hdr-status" id="hdrStatus"></span>
    </div>
    <a class="hdr-act" id="hdrBack" href="./" title="Back to To Do" aria-label="Back to To Do">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </a>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="today" aria-selected="true">Today</button>
    <button role="tab" data-view="week" aria-selected="false">Week</button>
    <button role="tab" data-view="patterns" aria-selected="false">Patterns</button>
    <button role="tab" data-view="plan" aria-selected="false">Plan</button>

  <div class="body" id="scrollBody">
    <div id="view"></div>
    <div class="status" id="status"></div>
  </div>

  <div class="bar">

    <div class="navrow">
      <button class="btn-nav" id="prev" aria-label="Previous day"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="popwrap">
        <button class="pill" id="dayPill" aria-haspopup="true" aria-expanded="false">
          <span class="pl" id="dayPillLabel">&nbsp;</span>
          <span class="pc" id="dayPillCount"></span>
          <span class="cv"><svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
        </button>
        <div class="popup" id="dayPopup" hidden></div>
      </div>
      <button class="btn-nav" id="next" aria-label="Next day"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>

    <div class="bar-row">
      <div class="popwrap">
        <button class="btn-sec" id="pickBtn" aria-label="Log a planned activity" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M4 6h0.01"/><path d="M4 12h0.01"/><path d="M4 18h0.01"/></svg></button>
        <div class="popup" id="pickPopup" hidden></div>
      </div>
      <div class="composer">
        <textarea id="quick" rows="1" placeholder="log something you did&hellip;" aria-label="Log something you did"></textarea>
      </div>
      <button class="btn-pri idle" id="send" aria-label="Log it"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
    </div>

  </div>

</div>

<script>
(function () {
  "use strict";

  // ---------- constants ----------
  var WD = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  var WD_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WINDOW_DAYS = 28;

  var DEFAULT_PLAN = {
    version: 2,
    items: [
      { id:'breakfast', label:'Breakfast',  start:'07:30', dur:30, days:[0,1,2,3,4,5,6], kind:'meal' },
      { id:'prep_eng',  label:'English prep', start:'08:00', dur:30, days:[0], kind:'fixed' },
      { id:'walk_am',   label:'Walk',       start:'08:00', dur:30, days:[1,2,3,4,5], kind:'walk', track:true },
      { id:'teaching',  label:'Teaching English', start:'08:30', dur:255, days:[0], kind:'fixed',
        note:'Leave 08:30, class 10:00 to 11:30, home about 12:45' },
      { id:'stretch',   label:'Exercises',  start:'08:30', dur:20, days:[1,3,4], kind:'stretch', track:true, target:3 },
      { id:'vhs_post',  label:'English follow-up', start:'09:00', dur:60, days:[1], kind:'fixed' },
      { id:'clean',     label:'Clean the flat', start:'09:00', dur:60, days:[2], kind:'chore', track:true, target:1 },
      { id:'morning_a', label:'Housework, admin, Hausmeister', start:'10:00', dur:180, days:[1,2], kind:'work' },
      { id:'morning_b', label:'Housework, admin, Hausmeister', start:'09:00', dur:240, days:[3,4], kind:'work' },
      { id:'hike',      label:'Hike',       start:'08:30', dur:480, days:[6], kind:'hike', track:true, target:1 },
      { id:'lunch',     label:'Lunch',      start:'13:00', dur:45, days:[0,1,2,3,4,5,6], kind:'meal' },
      { id:'walk_pm',   label:'Walk',       start:'13:45', dur:30, days:[0,1,2,3,4,5], kind:'walk', track:true },
      { id:'maryam_in', label:'Maryam arrives', start:'14:00', dur:0, days:[2], kind:'ctx' },
      { id:'work_pm',   label:'Coincidental work', start:'14:15', dur:240, days:[0,1,2,3,4], kind:'work' },
      { id:'maryam_out',label:'Maryam back to her mum’s', start:'16:00', dur:0, days:[5], kind:'ctx' },
      { id:'cook',      label:'Cook dinner', start:'18:15', dur:45, days:[0,1,2,3,4,5,6], kind:'cook', track:true },
      { id:'dinner',    label:'Dinner',     start:'19:00', dur:60, days:[0,1,2,3,4,5,6], kind:'meal' },
      { id:'walk_eve',  label:'Walk',       start:'20:00', dur:30, days:[0,1,2,3,4,5,6], kind:'walk', track:true }
    ],
    history: []
  };

  var MARYAM_DAYS = [2,3,4,5]; // Wed to Sat

  // ---------- Ink avatar palette (Ink.cs) ----------
  var AVATARS = ['#1F56B8','#2E9C8E','#B86A00','#8E44AD','#C0395B','#2C82C9'];
  function avatarColour(name){
    var h = 0, s = name || '';
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0x7fffffff;
    return AVATARS[h % AVATARS.length];
  }

  // ---------- icons ----------
  var SVGNS = 'http://www.w3.org/2000/svg';
  function icon(paths, size){
    var s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('width', size || 13); s.setAttribute('height', size || 13);
    s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', '2');
    s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
    paths.split('|').forEach(function(d){
      var p = document.createElementNS(SVGNS, 'path');
      p.setAttribute('d', d); s.appendChild(p);
    });
    return s;
  }
  var I_CHECK = 'M20 6L9 17l-5-5';
  var I_MINUS = 'M5 12h14';
  var I_MORE  = 'M5 12h0.01|M12 12h0.01|M19 12h0.01';

  // ---------- date helpers ----------
  function pad(n){ return (n<10?'0':'')+n; }
  function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fromIso(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
  function dow(d){ return (d.getDay()+6)%7; }            // 0 = Monday
  function mondayOf(d){ return addDays(d, -dow(d)); }
  function mins(hhmmStr){ var p=hhmmStr.split(':'); return (+p[0])*60 + (+p[1]); }
  function hhmm(m){ m=Math.max(0,Math.min(1439, Math.round(m))); return pad(Math.floor(m/60))+':'+pad(m%60); }
  function nowRounded(){ var n=new Date(); return hhmm(Math.round((n.getHours()*60+n.getMinutes())/5)*5); }
  function median(arr){ if(!arr.length) return null; var a=arr.slice().sort(function(x,y){return x-y;});
    var m=Math.floor(a.length/2); return a.length%2 ? a[m] : Math.round((a[m-1]+a[m])/2); }

  // ---------- model state ----------
  var plan = JSON.parse(JSON.stringify(DEFAULT_PLAN));
  var logs = {};   // isoDate -> {date, entries:{itemId:{status,at,unplanned}}}

  // ---------- storage: rhythm.json via the GitHub Contents API ----------
  var REPO    = 'Jeff-Lynn-SC/todo';
  var FILE    = 'rhythm.json';
  var API_URL = 'https://api.github.com/repos/' + REPO + '/contents/' + FILE;
  var LS_KEY  = 'rhythm.doc';

  var fileSha = null;
  var remoteReady = false;
  var dirty = false;
  var saving = false;
  var saveTimer = null;
  var SAVE_DELAY = 1200;

  function getPat(){ try { return localStorage.getItem('gh_pat'); } catch(e){ return null; } }
  function lsGet(k, fb){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } }
  function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  function b64encode(s){ return btoa(unescape(encodeURIComponent(s))); }
  function b64decode(s){ return decodeURIComponent(escape(atob(s.replace(/\n/g,'')))); }

  function setStatus(text, withRetry){
    var host = document.getElementById('status');
    host.textContent = text;
    if (withRetry) {
      var b = document.createElement('button');
      b.textContent = 'Try again';
      b.addEventListener('click', function(){ dirty = true; flush(); });
      host.appendChild(b);
    }
  }

  function showPatModal(msg){
    document.getElementById('pat-modal').style.display = 'flex';
    document.getElementById('pat-msg').textContent = msg || '';
    setTimeout(function(){ document.getElementById('pat-input').focus(); }, 0);
  }
  function hidePatModal(){ document.getElementById('pat-modal').style.display = 'none'; }

  function currentDoc(){ return { plan: plan, logs: logs }; }

  function adoptDoc(doc){
    if (!doc) return;
    if (doc.plan && doc.plan.items && (doc.plan.version || 1) >= DEFAULT_PLAN.version) {
      plan = JSON.parse(JSON.stringify(doc.plan));
    } else if (doc.plan && doc.plan.history) {
      plan.history = doc.plan.history;
    }
    if (doc.logs && typeof doc.logs === 'object') logs = JSON.parse(JSON.stringify(doc.logs));
  }

  function save(){
    lsSet(LS_KEY, currentDoc());
    dirty = true;
    if (!remoteReady) return;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, SAVE_DELAY);
  }

  async function flush(){
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    if (!dirty || saving || !remoteReady) return;
    var pat = getPat();
    if (!pat) { showPatModal(); return; }

    saving = true;
    dirty = false;
    setStatus('Saving…');

    var body = { message: 'update rhythm', content: b64encode(JSON.stringify(currentDoc(), null, 2)) };
    if (fileSha) body.sha = fileSha;

    try {
      var res = await fetch(API_URL, {
        method: 'PUT',
        headers: { Authorization: 'token ' + pat, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (res.status === 401) {
        try { localStorage.removeItem('gh_pat'); } catch(e){}
        saving = false; dirty = true;
        showPatModal('Token rejected — please re-enter.');
        return;
      }
      if (res.status === 409 || res.status === 422) {
        saving = false; dirty = true;
        await refreshSha();
        saveTimer = setTimeout(flush, 400);
        return;
      }
      if (!res.ok) { throw new Error('HTTP ' + res.status); }
      var d = await res.json();
      if (d && d.content) fileSha = d.content.sha;
      saving = false;
      if (dirty) { saveTimer = setTimeout(flush, 200); }
      else { setStatus('Saved to ' + FILE + '. Opens the same on any device.'); }
    } catch (e) {
      saving = false;
      dirty = true;
      setStatus('Could not reach GitHub. Kept on this device.', true);
    }
  }

  async function refreshSha(){
    var pat = getPat();
    if (!pat) return;
    try {
      var res = await fetch(API_URL, { headers: { Authorization: 'token ' + pat, Accept: 'application/vnd.github.v3+json' } });
      if (res.ok) { var meta = await res.json(); fileSha = meta.sha; }
    } catch(e){}
  }

  async function bootStorage(){
    adoptDoc(lsGet(LS_KEY, null));
    render();

    var pat = getPat();
    if (!pat) { setStatus('Saved on this device only.'); showPatModal(); return; }

    try {
      var res = await fetch(API_URL, {
        headers: { Authorization: 'token ' + pat, Accept: 'application/vnd.github.v3+json' }
      });
      if (res.status === 401) {
        try { localStorage.removeItem('gh_pat'); } catch(e){}
        setStatus('Saved on this device only.');
        showPatModal('Token rejected — please re-enter.');
        return;
      }
      if (res.ok) {
        var meta = await res.json();
        fileSha = meta.sha;
        var remote = null;
        try { remote = JSON.parse(b64decode(meta.content)); } catch(e){ remote = null; }
        if (remote) {
          var localLogs = logs;
          adoptDoc(remote);
          Object.keys(localLogs).forEach(function(k){ if (!logs[k]) logs[k] = localLogs[k]; });
          lsSet(LS_KEY, currentDoc());
        }
        remoteReady = true;
        setStatus('Saved to ' + FILE + '. Opens the same on any device.');
      } else if (res.status === 404) {
        fileSha = null;
        remoteReady = true;
        dirty = true;
        flush();
      } else {
        setStatus('Saved on this device only.');
      }
    } catch(e) {
      setStatus('Could not reach GitHub. Saved on this device only.', true);
    }
    render();
  }

  function flushNow(){ if (dirty && remoteReady && !saving) flush(); }
  window.addEventListener('pagehide', flushNow);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden') flushNow();
  });

  document.getElementById('pat-save').addEventListener('click', function(){
    var v = document.getElementById('pat-input').value.trim();
    if (!v) return;
    try { localStorage.setItem('gh_pat', v); } catch(e){}
    hidePatModal();
    document.getElementById('pat-input').value = '';
    bootStorage();
  });
  document.getElementById('pat-input').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('pat-save').click();
  });

  // ---------- dialogs ----------
  // In-app rather than window.prompt/confirm: native dialogs are unreliable
  // inside a home-screen web app, and these match the rest of the window.
  var dlg = document.getElementById('dlg');
  var dlgTitle = document.getElementById('dlgTitle');
  var dlgSub = document.getElementById('dlgSub');
  var dlgInput = document.getElementById('dlgInput');
  var dlgActions = document.getElementById('dlgActions');

  function closeDlg(){ dlg.hidden = true; dlgInput.hidden = true; dlgActions.innerHTML = ''; }

  function showDlg(opts){
    dlgTitle.textContent = opts.title || '';
    dlgSub.textContent = opts.sub || '';
    dlgActions.innerHTML = '';
    if (opts.input) {
      dlgInput.hidden = false;
      dlgInput.value = opts.input.value || '';
    } else {
      dlgInput.hidden = true;
    }
    (opts.actions || []).forEach(function(a){
      var b = el('button', 'dlg-btn' + (a.cls ? ' ' + a.cls : ''), a.label);
      b.addEventListener('click', function(){
        var v = dlgInput.value;
        closeDlg();
        if (a.onClick) a.onClick(v);
      });
      dlgActions.appendChild(b);
    });
    var c = el('button','dlg-btn quiet','Cancel');
    c.addEventListener('click', closeDlg);
    dlgActions.appendChild(c);
    dlg.hidden = false;
    if (opts.input) setTimeout(function(){ dlgInput.focus(); dlgInput.select(); }, 0);
  }

  function askText(title, sub, value, okLabel, onOk){
    showDlg({ title: title, sub: sub, input: { value: value },
      actions: [{ label: okLabel, cls: 'primary', onClick: onOk }] });
  }

  dlg.addEventListener('click', function(e){ if (e.target === dlg) closeDlg(); });
  dlgInput.addEventListener('keydown', function(e){
    if (e.key !== 'Enter') return;
    var p = dlgActions.querySelector('.dlg-btn.primary');
    if (p) p.click();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !dlg.hidden) closeDlg();
  });

  // ---------- model helpers ----------
  function itemById(id){ for (var i=0;i<plan.items.length;i++) if (plan.items[i].id===id) return plan.items[i]; return null; }
  function itemsForDay(d){
    var w = dow(d);
    return plan.items.filter(function(it){ return it.days.indexOf(w) !== -1; })
      .slice().sort(function(a,b){ return mins(a.start)-mins(b.start); });
  }
  function logFor(date){ return logs[date] || { date: date, entries: {} }; }
  function entry(date, id){ var l = logs[date]; return l && l.entries ? l.entries[id] : null; }

  function dayNote(date){ var l = logs[date]; return (l && l.note) || ''; }

  function setDayNote(date, text){
    var l = logs[date] || (logs[date] = { date: date, entries: {} });
    if ((text || '').trim() === '') {
      delete l.note;
      if (!Object.keys(l.entries).length) delete logs[date];
    } else {
      l.note = text;
    }
    save();
  }

  function setEntry(date, id, status, at){
    var l = logs[date] || (logs[date] = { date: date, entries: {} });
    if (status === null) { delete l.entries[id]; }
    else {
      var it = itemById(id);
      var planned = it && it.days.indexOf(dow(fromIso(date))) !== -1;
      l.entries[id] = { status: status, at: at || null, unplanned: !planned };
    }
    save();
  }

  // ---------- state ----------
  var view = 'today';
  var cursor = iso(new Date());

  function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

  // ---------- header / bottom bar ----------
  function dayProgress(d){
    var date = iso(d), done = 0, total = 0;
    itemsForDay(d).forEach(function(it){
      if (!it.track) return;
      var e = entry(date, it.id);
      if (e && e.status === 'na') return;
      total++;
      if (e && e.status === 'done') done++;
    });
    return { done: done, total: total };
  }

  function updateChrome(){
    var d = fromIso(cursor);
    var today = iso(new Date());

    var bits = [];
    if (view === 'plan') bits.push('Add, retime and move anything');
    else if (view === 'patterns') bits.push('Last ' + WINDOW_DAYS + ' days');
    else if (view === 'week') bits.push('Week of ' + mondayOf(d).getDate() + ' ' + MONTHS[mondayOf(d).getMonth()]);
    else {
      if (cursor === today) bits.push('Today');
      if (MARYAM_DAYS.indexOf(dow(d)) !== -1) bits.push('Maryam here');
    }
    document.getElementById('hdrStatus').textContent = bits.join(' · ');

    document.getElementById('dayPillLabel').textContent =
      WD[dow(d)] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];

    var p = dayProgress(d);
    document.getElementById('dayPillCount').textContent = p.total ? (p.done + ' of ' + p.total) : '';
  }

  // ---------- day picker popup ----------
  var popup = document.getElementById('dayPopup');
  var pill = document.getElementById('dayPill');

  function closePopup(){ popup.hidden = true; pill.setAttribute('aria-expanded','false'); }
  function openPopup(){
    closePick();
    popup.innerHTML = '';
    var d = fromIso(cursor), mon = mondayOf(d), today = iso(new Date());
    for (var i=0;i<7;i++){
      (function(i){
        var day = addDays(mon,i), date = iso(day);
        var b = el('button', date === cursor ? 'on' : null);
        var dot = el('span','pdot');
        dot.style.visibility = (date === today) ? 'visible' : 'hidden';
        b.appendChild(dot);
        b.appendChild(document.createTextNode(
          WD_SHORT[i] + ' ' + day.getDate() + ' ' + MON_SHORT[day.getMonth()]));
        b.addEventListener('click', function(){
          cursor = date; closePopup(); render();
        });
        popup.appendChild(b);
      })(i);
    }
    var t = el('button', null, 'Jump to today');
    t.style.borderTop = '1px solid var(--border)';
    t.style.marginTop = '4px';
    t.style.paddingTop = '9px';
    t.addEventListener('click', function(){ cursor = today; closePopup(); render(); });
    popup.appendChild(t);
    popup.hidden = false;
    pill.setAttribute('aria-expanded','true');
  }

  pill.addEventListener('click', function(e){
    e.stopPropagation();
    if (popup.hidden) openPopup(); else closePopup();
  });

  // ---------- activity picker popup ----------
  var pickBtn = document.getElementById('pickBtn');
  var pickPopup = document.getElementById('pickPopup');

  function closePick(){ pickPopup.hidden = true; pickBtn.setAttribute('aria-expanded','false'); }
  function openPick(){
    closePopup();
    pickPopup.innerHTML = '';
    var date = cursor, items = loggable(fromIso(cursor));
    if (!items.length) {
      var none = el('div', null, 'Nothing else to log today.');
      none.style.cssText = 'padding:7px 9px;font-size:12px;color:var(--muted)';
      pickPopup.appendChild(none);
    } else {
      items.forEach(function(it){
        var b = el('button');
        var dot = el('span','pdot');
        dot.style.background = avatarColour(it.label);
        b.appendChild(dot);
        b.appendChild(document.createTextNode(it.label));
        b.addEventListener('click', function(){
          setEntry(date, it.id, 'done', date === iso(new Date()) ? nowRounded() : it.start);
          closePick(); render();
        });
        pickPopup.appendChild(b);
      });
    }
    pickPopup.hidden = false;
    pickBtn.setAttribute('aria-expanded','true');
  }
  pickBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (pickPopup.hidden) openPick(); else closePick();
  });

  document.addEventListener('click', function(e){
    if (!popup.hidden && !popup.contains(e.target)) closePopup();
    if (!pickPopup.hidden && !pickPopup.contains(e.target)) closePick();
  });
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (!popup.hidden) closePopup();
    if (!pickPopup.hidden) closePick();
  });

  // ---------- quick log ----------
  var quick = document.getElementById('quick');
  var sendBtn = document.getElementById('send');

  function autoGrow(){
    quick.style.height = '0px';
    quick.style.height = Math.min(Math.max(quick.scrollHeight, 22), 140) + 'px';
  }
  function syncSend(){ sendBtn.classList.toggle('idle', quick.value.trim() === ''); }

  quick.addEventListener('input', function(){ autoGrow(); syncSend(); });
  // Caught before the field sees it: Enter logs, Shift+Enter breaks the line.
  quick.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuick(); }
  });
  sendBtn.addEventListener('click', function(){
    if (quick.value.trim() === '') { quick.focus(); return; }
    submitQuick();
  });

  function submitQuick(){
    var raw = quick.value.replace(/\r/g, '').trim();
    if (!raw) return;
    var lines = raw.split('\n');
    var label = lines[0].trim().slice(0, 80);
    var rest = lines.slice(1).join(' ').trim();
    if (!label) return;

    var date = cursor;
    var at = (date === iso(new Date())) ? nowRounded() : '12:00';

    // Reuse an activity of the same name rather than making a near-duplicate.
    var found = null;
    plan.items.forEach(function(it){
      if (!found && it.label.toLowerCase() === label.toLowerCase()) found = it;
    });
    if (!found) {
      found = { id: slug(label), label: label, start: at, dur: 0, days: [],
                kind: 'logged', track: true };
      if (rest) found.note = rest;
      plan.items.push(found);
      note('Logged ' + label + ' for the first time');
    } else if (rest && !found.note) {
      found.note = rest;
    }

    setEntry(date, found.id, 'done', at);
    quick.value = '';
    autoGrow(); syncSend();
    render();
  }

  // ---------- render ----------
  function render(){
    var d = fromIso(cursor);
    updateChrome();
    var host = document.getElementById('view');
    host.innerHTML = '';
    if (view === 'today') host.appendChild(renderToday(d));
    else if (view === 'week') host.appendChild(renderWeek(d));
    else if (view === 'plan') host.appendChild(renderPlanEditor());
    else host.appendChild(renderPatterns());
  }

  function renderToday(d){
    var frag = document.createDocumentFragment();
    var list = el('div','spine');
    var items = itemsForDay(d);
    var date = iso(d);
    var isToday = date === iso(new Date());
    var nowM = new Date().getHours()*60 + new Date().getMinutes();
    var nowPlaced = false;

    var l = logFor(date);
    Object.keys(l.entries).forEach(function(id){
      if (l.entries[id].unplanned) {
        var it = itemById(id);
        if (it && items.indexOf(it) === -1) {
          var clone = Object.assign({}, it, { start: l.entries[id].at || it.start, _extra: true });
          items.push(clone);
        }
      }
    });
    items.sort(function(a,b){ return mins(a.start)-mins(b.start); });

    items.forEach(function(it){
      if (isToday && !nowPlaced && mins(it.start) > nowM) {
        var nl = el('div','nowline');
        nl.appendChild(el('div','t', hhmm(nowM)));
        nl.appendChild(el('div','ln'));
        list.appendChild(nl); nowPlaced = true;
      }
      list.appendChild(renderRow(it, date));
    });
    if (isToday && !nowPlaced) {
      var nl2 = el('div','nowline');
      nl2.appendChild(el('div','t', hhmm(nowM)));
      nl2.appendChild(el('div','ln'));
      list.appendChild(nl2);
    }
    frag.appendChild(list);
    frag.appendChild(renderNotes(d));
    frag.appendChild(renderTally(d));
    return frag;
  }

  function renderNotes(d){
    var date = iso(d);
    var box = el('div','notes');
    box.appendChild(el('div','notes-h','Notes'));

    var wrap = el('div','block-in');
    var ta = document.createElement('textarea');
    ta.className = 'note-in';
    ta.rows = 1;
    ta.placeholder = 'anything worth remembering about today\u2026';
    ta.value = dayNote(date);
    ta.setAttribute('aria-label', 'Notes for this day');

    function grow(){
      ta.style.height = '0px';
      ta.style.height = Math.min(Math.max(ta.scrollHeight, 18), 160) + 'px';
    }
    // Writing straight to the model on each keystroke is safe: save() is
    // debounced, and nothing re-renders this field while you are typing.
    ta.addEventListener('input', function(){ grow(); setDayNote(date, ta.value); });

    wrap.appendChild(ta);
    box.appendChild(wrap);
    setTimeout(grow, 0);
    return box;
  }

  function renderRow(it, date){
    var e = entry(date, it.id);
    var tracked = !!it.track;
    var row = el('div','row' + (tracked ? '' : ' ctx') + (e && e.status === 'na' ? ' na' : ''));

    row.appendChild(el('div','t', it.start));

    var rail = el('div','rail');
    var dot = el('div','dot' + (tracked ? '' : ' small'));
    // Colour identity lives in the dot, from the name hash. State is the fill.
    dot.style.setProperty('--dot', avatarColour(it.label));
    if (e && e.status === 'done') dot.className = 'dot done';
    if (e && e.status === 'skipped') dot.className = 'dot skipped';
    if (e && e.status === 'na') dot.className = 'dot na';
    rail.appendChild(dot);
    row.appendChild(rail);

    var bd = el('div','bd');
    bd.appendChild(el('div','lab', it.label + (it._extra ? ' (extra)' : '')));
    if (it.note) bd.appendChild(el('div','note', it.note));
    if (e && e.status === 'done' && e.at) {
      var a = el('div','actual');
      var b = el('button', null, 'done at ' + e.at);
      b.addEventListener('click', function(){ editTime(date, it, e.at); });
      a.appendChild(b); bd.appendChild(a);
    }
    row.appendChild(bd);

    if (tracked) {
      // every action for this row lives behind one button
      var gh = el('button','ghost');
      gh.setAttribute('aria-label','More for ' + it.label);
      gh.title = 'More';
      gh.appendChild(icon(I_MORE, 13));
      gh.addEventListener('click', function(){ rowMenu(date, it, e); });
      row.appendChild(gh);

      // The whole row is a hit target, not just that button: on a phone a
      // small grey glyph is easy to miss entirely.
      row.style.cursor = 'pointer';
      row.addEventListener('click', function(ev){
        if (ev.target.closest && ev.target.closest('.ctl, .ghost, .actual')) return;
        rowMenu(date, it, e);
      });

      var ctl = el('div','ctl');
      var ok = el('button');
      ok.appendChild(icon(I_CHECK, 13));
      ok.setAttribute('aria-label','Mark ' + it.label + ' done');
      ok.setAttribute('aria-pressed', e && e.status==='done' ? 'true':'false');
      ok.addEventListener('click', function(){
        if (e && e.status === 'done') setEntry(date, it.id, null);
        else setEntry(date, it.id, 'done', date === iso(new Date()) ? nowRounded() : it.start);
        render();
      });
      var no = el('button','skip');
      no.appendChild(icon(I_MINUS, 13));
      no.setAttribute('aria-label','Mark ' + it.label + ' missed');
      no.setAttribute('aria-pressed', e && e.status==='skipped' ? 'true':'false');
      no.addEventListener('click', function(){
        if (e && e.status === 'skipped') setEntry(date, it.id, null);
        else setEntry(date, it.id, 'skipped');
        render();
      });
      ctl.appendChild(ok); ctl.appendChild(no);
      row.appendChild(ctl);
    }
    return row;
  }

  function editTime(date, it, current){
    askText('When did you do it?', 'Twenty-four hour, like 09:15.',
            current || it.start, 'Save', function(v){
      v = (v || '').trim();
      if (!/^\d{1,2}:\d{2}$/.test(v)) return;
      setEntry(date, it.id, 'done', hhmm(mins(v)));
      render();
    });
  }

  function renameItem(it){
    askText('Rename', 'What should this be called?', it.label, 'Rename', function(v){
      v = (v || '').trim();
      if (!v || v === it.label) return;
      note('Renamed ' + it.label + ' to ' + v);
      it.label = v;
      save(); render();
    });
  }

  function entryCount(id){
    var n = 0;
    Object.keys(logs).forEach(function(k){
      if (logs[k].entries && logs[k].entries[id]) n++;
    });
    return n;
  }

  // Deleting takes the log entries with it. Leaving them behind would orphan
  // them against an id nothing resolves, which loses the record silently.
  function deleteItem(it){
    plan.items = plan.items.filter(function(x){ return x.id !== it.id; });
    Object.keys(logs).forEach(function(k){
      if (logs[k].entries && logs[k].entries[it.id]) delete logs[k].entries[it.id];
    });
    note('Deleted ' + it.label);
    save(); render();
  }

  function confirmDelete(it){
    var n = entryCount(it.id);
    showDlg({
      title: 'Delete ' + it.label + '?',
      sub: (n === 0 ? 'Nothing has been logged against it.'
         : n === 1 ? 'One logged day goes with it.'
                   : n + ' logged days go with it.') + ' This cannot be undone.',
      actions: [{ label: 'Delete', cls: 'danger', onClick: function(){ deleteItem(it); } }]
    });
  }

  // Everything you can do to one row, in one place.
  function rowMenu(date, it, e){
    // renderToday hands us a clone for unplanned rows, so anything that edits
    // the activity has to land on the real plan item rather than the copy.
    var real = itemById(it.id) || it;
    var actions = [], st = e ? e.status : null, isExtra = real.kind === 'logged';

    if (st === 'done') {
      actions.push({ label: 'Change the time\u2026', onClick: function(){ editTime(date, it, e.at); } });
      actions.push({ label: 'Clear this entry', onClick: function(){ setEntry(date, it.id, null); render(); } });
    } else {
      actions.push({ label: 'Done, at another time\u2026', onClick: function(){ editTime(date, it, null); } });
    }

    if (!isExtra) {
      if (st === 'na') {
        actions.push({ label: 'Put it back on today', onClick: function(){ setEntry(date, it.id, null); render(); } });
      } else {
        actions.push({ label: 'Not needed today', onClick: function(){ setEntry(date, it.id, 'na'); render(); } });
      }
    } else {
      actions.push({ label: 'Rename\u2026', onClick: function(){ renameItem(real); } });
      actions.push({ label: 'Delete it and its history', cls: 'danger', onClick: function(){ confirmDelete(real); } });
    }

    showDlg({ title: real.label, sub: real.note || '', actions: actions });
  }

  function weekStats(anyDate){
    var mon = mondayOf(anyDate);
    var out = {};
    plan.items.forEach(function(it){ if (it.track) out[it.id] = { done:0, planned:0 }; });
    for (var i=0;i<7;i++){
      var d = addDays(mon,i), date = iso(d), w = dow(d);
      plan.items.forEach(function(it){
        if (!it.track) return;
        var e = entry(date, it.id);
        if (it.days.indexOf(w) !== -1 && !(e && e.status === 'na')) out[it.id].planned++;
        if (e && e.status === 'done') out[it.id].done++;
      });
    }
    return out;
  }

  function renderTally(d){
    var s = weekStats(d);
    var box = el('div','tally');
    function line(label, id){
      var st = s[id]; if (!st) return;
      var sp = el('span');
      sp.appendChild(document.createTextNode(label + ' '));
      var pips = el('span','pips');
      var total = Math.max(st.planned, st.done, 1);
      for (var i=0;i<total;i++) pips.appendChild(el('span','pip' + (i < st.done ? ' on' : '')));
      sp.appendChild(pips);
      box.appendChild(sp);
    }
    var walkDone = (s.walk_am?s.walk_am.done:0)+(s.walk_pm?s.walk_pm.done:0)+(s.walk_eve?s.walk_eve.done:0);
    var walkPlan = (s.walk_am?s.walk_am.planned:0)+(s.walk_pm?s.walk_pm.planned:0)+(s.walk_eve?s.walk_eve.planned:0);
    box.appendChild(el('span', null, 'Walks ' + walkDone + ' of ' + walkPlan + ' this week'));
    line('Exercises', 'stretch');
    line('Cleaning', 'clean');
    line('Hike', 'hike');
    return box;
  }

  var STALE_DAYS = 21;

  function loggedRecently(id, days){
    var today = new Date();
    for (var i = 0; i <= days; i++) {
      var e = entry(iso(addDays(today, -i)), id);
      if (e && e.status === 'done') return true;
    }
    return false;
  }

  // A one-off caught by the quick-log that has since gone quiet. Nothing is
  // ever deleted: the log entries stay put and Patterns still counts them,
  // the item is only folded out of the picker and the plan list. Limited to
  // kind 'logged' so an activity you built by hand never vanishes on you,
  // even if you strip its days.
  function isStaleOneOff(it){
    return it.kind === 'logged' && it.days.length === 0 && !loggedRecently(it.id, STALE_DAYS);
  }

  // Things you could log today that are not already on today's plan.
  function loggable(d){
    var date = iso(d), w = dow(d);
    return plan.items.filter(function(it){
      if (!it.track) return false;
      if (it.days.indexOf(w) !== -1) return false;
      if (entry(date, it.id)) return false;
      if (isStaleOneOff(it)) return false;
      return true;
    });
  }

  function renderWeek(d){
    var mon = mondayOf(d);
    var grid = el('div','weekgrid');
    var today = iso(new Date());
    for (var i=0;i<7;i++){
      (function(i){
        var day = addDays(mon,i), date = iso(day);
        var col = el('div','wcol' + (date===today ? ' today':'') + (MARYAM_DAYS.indexOf(i)!==-1 ? ' maryam':''));
        col.appendChild(el('div','wd', WD_SHORT[i]));
        col.appendChild(el('div','dm', String(day.getDate())));
        var beads = el('div','beads');
        itemsForDay(day).forEach(function(it){
          if (!it.track) return;
          var e = entry(date, it.id);
          var cls = e && e.status==='done' ? ' done'
                  : e && e.status==='skipped' ? ' skipped'
                  : e && e.status==='na' ? ' na' : '';
          var b = el('div','bead' + cls);
          b.title = it.label;
          beads.appendChild(b);
        });
        col.appendChild(beads);
        if (dayNote(date)) {
          var mark = el('div','wnote');
          mark.title = 'Has notes';
          col.appendChild(mark);
        }
        col.addEventListener('click', function(){ cursor = date; view = 'today'; syncTabs(); render(); });
        grid.appendChild(col);
      })(i);
    }
    return grid;
  }

  // ---------- plan editor ----------
  function slug(s){
    var base = (s || 'item').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,24) || 'item';
    var id = base, n = 2;
    while (itemById(id)) { id = base + '_' + n; n++; }
    return id;
  }

  // Quick-logged one-offs older than STALE_DAYS are folded away by default.
  var showStale = false;

  function renderPlanEditor(){
    var frag = document.createDocumentFragment();

    var add = el('button','addbtn','Add an activity');
    add.addEventListener('click', function(){
      var it = { id: slug('new'), label:'New activity', start:'12:00', dur:30,
                 days:[dow(fromIso(cursor))], kind:'custom', track:true };
      plan.items.push(it);
      note('Added ' + it.label);
      save(); render();
      setTimeout(function(){
        var f = document.querySelector('.ed[data-id="' + it.id + '"] input.lab-in');
        if (f) { f.focus(); f.select(); }
      }, 0);
    });
    frag.appendChild(add);

    var live = [], stale = [];
    plan.items.slice().sort(function(a,b){ return mins(a.start)-mins(b.start); })
      .forEach(function(it){ (isStaleOneOff(it) ? stale : live).push(it); });

    live.forEach(function(it){ frag.appendChild(renderEditCard(it, false)); });

    if (stale.length) {
      var t = el('button','stale-toggle', showStale
        ? 'Hide the older one-offs'
        : 'Show ' + stale.length + ' older one-off' + (stale.length === 1 ? '' : 's'));
      t.addEventListener('click', function(){ showStale = !showStale; render(); });
      frag.appendChild(t);
      if (showStale) stale.forEach(function(it){ frag.appendChild(renderEditCard(it, true)); });
    }

    frag.appendChild(el('p','edtip', 'Times and days here are the plan. What you tick on the day is what actually happened — Patterns compares the two.'));
    return frag;
  }

  function renderEditCard(it, stale){
    var card = el('div','ed' + (stale ? ' dim' : ''));
    card.setAttribute('data-id', it.id);

    var top = el('div','ed-top');
    var lab = document.createElement('input');
    lab.type = 'text'; lab.className = 'lab-in'; lab.value = it.label;
    lab.setAttribute('aria-label','Activity name');
    lab.addEventListener('change', function(){
      it.label = lab.value.trim() || 'Untitled';
      note('Renamed to ' + it.label); save();
    });
    top.appendChild(lab);

    var del = el('button','del','Remove');
    del.addEventListener('click', function(){ confirmDelete(it); });
    top.appendChild(del);
    card.appendChild(top);

    var line = el('div','ed-line');
    var t = document.createElement('input');
    t.type = 'time'; t.value = it.start; t.step = 300; t.setAttribute('aria-label','Start time');
    t.addEventListener('change', function(){
      if (!t.value) return;
      it.start = t.value; note(it.label + ' moved to ' + it.start); save(); render();
    });
    line.appendChild(el('span','ed-lbl','Starts'));
    line.appendChild(t);

    var dur = document.createElement('input');
    dur.type = 'number'; dur.min = '0'; dur.step = '5'; dur.value = String(it.dur || 0);
    dur.className = 'dur-in'; dur.setAttribute('aria-label','Length in minutes');
    dur.addEventListener('change', function(){ it.dur = Math.max(0, +dur.value || 0); save(); });
    line.appendChild(el('span','ed-lbl','for'));
    line.appendChild(dur);
    line.appendChild(el('span','ed-lbl','min'));
    card.appendChild(line);

    var days = el('div','ed-days');
    WD_SHORT.forEach(function(name, i){
      var b = el('button','day' + (it.days.indexOf(i)!==-1 ? ' on' : ''), name);
      b.setAttribute('aria-pressed', it.days.indexOf(i)!==-1 ? 'true':'false');
      b.addEventListener('click', function(){
        var k = it.days.indexOf(i);
        if (k === -1) it.days.push(i); else it.days.splice(k,1);
        it.days.sort(function(a,b2){ return a-b2; });
        note(it.label + ' now on ' + (it.days.length ? it.days.map(function(w){return WD_SHORT[w];}).join(', ') : 'no days'));
        save(); render();
      });
      days.appendChild(b);
    });
    card.appendChild(days);

    var trk = el('label','ed-track');
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = !!it.track;
    cb.addEventListener('change', function(){ it.track = cb.checked; save(); render(); });
    trk.appendChild(cb);
    trk.appendChild(document.createTextNode(' Tick this off each day'));
    card.appendChild(trk);

    return card;
  }

  // ---------- pattern analysis ----------
  function analyse(){
    var end = new Date(), start = addDays(end, -WINDOW_DAYS);
    var res = {};
    plan.items.forEach(function(it){
      if (!it.track) return;
      res[it.id] = { item: it, done:0, skipped:0, times:[], byDay:[0,0,0,0,0,0,0], unplannedByDay:[0,0,0,0,0,0,0] };
    });
    for (var d = new Date(start.getTime()); d <= end; d = addDays(d,1)){
      var date = iso(d), w = dow(d);
      var l = logs[date]; if (!l) continue;
      Object.keys(l.entries).forEach(function(id){
        var r = res[id]; if (!r) return;
        var e = l.entries[id];
        if (e.status === 'done'){
          r.done++;
          r.byDay[w]++;
          if (e.unplanned) r.unplannedByDay[w]++;
          if (e.at) r.times.push(mins(e.at));
        } else if (e.status === 'skipped'){ r.skipped++; }
      });
    }
    return res;
  }

  function suggestions(res){
    var out = [];
    Object.keys(res).forEach(function(id){
      var r = res[id], it = r.item, logged = r.done + r.skipped;
      if (logged < 5) return;
      var rate = r.done / logged;
      var med = median(r.times);

      if (med != null && r.done >= 4) {
        var drift = med - mins(it.start);
        if (Math.abs(drift) >= 25) {
          out.push({
            title: it.label + ' happens later than planned',
            body: 'Planned for ' + it.start + '. When you do it, the middle value is ' + hhmm(med) +
                  ', so the plan is about ' + Math.abs(Math.round(drift)) + ' minutes out.',
            action: 'Move it to ' + hhmm(med),
            apply: function(){ it.start = hhmm(med); note(it.label + ' moved to ' + it.start); }
          });
        }
      }

      if (it.target && it.target > 1) {
        var scheduled = it.days.slice();
        var best = [];
        for (var w=0; w<7; w++) best.push({ w:w, n:r.byDay[w] });
        best.sort(function(a,b){ return b.n - a.n; });
        var top = best.slice(0, it.target).filter(function(x){ return x.n > 0; }).map(function(x){ return x.w; }).sort();
        var worstScheduled = scheduled.slice().sort(function(a,b){ return r.byDay[a]-r.byDay[b]; })[0];
        if (top.length === it.target && top.join() !== scheduled.slice().sort().join() && r.byDay[worstScheduled] === 0) {
          out.push({
            title: it.label + ' never happens on ' + WD[worstScheduled],
            body: 'Over the last ' + WINDOW_DAYS + ' days it landed on ' +
                  top.map(function(w){ return WD[w]; }).join(', ') + ' instead.',
            action: 'Reschedule to ' + top.map(function(w){ return WD_SHORT[w]; }).join(', '),
            apply: function(){
              it.days = top;
              note(it.label + ' moved to ' + top.map(function(w){ return WD_SHORT[w]; }).join(', '));
            }
          });
        }
      }

      if (rate < 0.5 && it.days.length > 3) {
        var keep = it.days.slice().sort(function(a,b){ return r.byDay[b]-r.byDay[a]; }).slice(0, Math.max(3, Math.round(it.days.length*rate))).sort();
        out.push({
          title: it.label + ' is asked for more often than it happens',
          body: 'Done ' + r.done + ' of ' + logged + ' logged days. A plan you miss half the time stops being a plan.',
          action: 'Cut it to ' + keep.length + ' days a week',
          apply: function(){
            it.days = keep;
            note(it.label + ' cut to ' + keep.map(function(w){ return WD_SHORT[w]; }).join(', '));
          }
        });
      }
    });
    return out;
  }

  function note(text){
    plan.history = plan.history || [];
    plan.history.unshift({ at: iso(new Date()), text: text });
    plan.history = plan.history.slice(0, 30);
    save();
  }

  function renderPatterns(){
    var frag = document.createDocumentFragment();
    var res = analyse();
    var anyData = Object.keys(res).some(function(k){ return res[k].done + res[k].skipped > 0; });

    if (!anyData) {
      frag.appendChild(el('div','empty', 'Nothing logged yet. Tick things off for a week or two and this page will tell you what is actually happening rather than what was planned.'));
      return frag;
    }

    Object.keys(res).forEach(function(id){
      var r = res[id], logged = r.done + r.skipped;
      if (logged === 0) return;
      var f = el('div','finding');
      f.appendChild(el('h3', null, r.item.label + (r.item.id.indexOf('walk')===0 ? ' (' + r.item.start + ')' : '')));
      var p = el('p');
      var rate = Math.round(100 * r.done / logged);
      p.appendChild(el('span','stat', r.done + ' of ' + logged));
      p.appendChild(document.createTextNode(' logged days, ' + rate + ' per cent.'));
      var med = median(r.times);
      if (med != null) p.appendChild(document.createTextNode(' Usually around ' + hhmm(med) + '.'));
      f.appendChild(p);
      frag.appendChild(f);
    });

    var sugs = suggestions(res);
    if (sugs.length) {
      var head = el('div','finding');
      head.appendChild(el('h3', null, 'What the plan should change'));
      frag.appendChild(head);
      sugs.forEach(function(s){
        var f = el('div','finding');
        f.appendChild(el('h3', null, s.title));
        // A long body renders as a block, the way a long chat message does.
        if (s.body.length >= 180) f.appendChild(el('div','block', s.body));
        else f.appendChild(el('p', null, s.body));
        var b = el('button','act', s.action);
        b.addEventListener('click', function(){ s.apply(); save(); render(); });
        f.appendChild(b);
        frag.appendChild(f);
      });
    } else {
      var f2 = el('div','finding');
      f2.appendChild(el('h3', null, 'Nothing worth changing yet'));
      f2.appendChild(el('p', null, 'Either the plan is holding or there is not enough logged to tell. Suggestions need about five logged days per item.'));
      frag.appendChild(f2);
    }

    if (plan.history && plan.history.length) {
      var h = el('div','hist');
      h.appendChild(el('h3', null, 'Changes so far'));
      var ul = el('ul');
      plan.history.forEach(function(x){ ul.appendChild(el('li', null, x.at + '  ' + x.text)); });
      h.appendChild(ul);
      frag.appendChild(h);
    }
    return frag;
  }

  // ---------- wiring ----------
  function syncTabs(){
    document.querySelectorAll('nav.tabs button').forEach(function(b){
      b.setAttribute('aria-selected', b.dataset.view === view ? 'true' : 'false');
    });
  }
  document.querySelectorAll('nav.tabs button').forEach(function(b){
    b.addEventListener('click', function(){ view = b.dataset.view; syncTabs(); render(); });
  });
  document.getElementById('prev').addEventListener('click', function(){
    cursor = iso(addDays(fromIso(cursor), view==='week' ? -7 : -1)); render();
  });
  document.getElementById('next').addEventListener('click', function(){
    cursor = iso(addDays(fromIso(cursor), view==='week' ? 7 : 1)); render();
  });

  // Inside the home-screen shell this header is the only one on screen, so its
  // back arrow has to return to the launcher rather than to the to-do list.
  var framed = false;
  if (window.self !== window.top) {
    var bl = document.getElementById('hdrBack');
    if (bl) {
      bl.setAttribute('href', '#');
      framed = true;
      bl.title = 'Back to the home screen';
      bl.setAttribute('aria-label', 'Back to the home screen');
      bl.addEventListener('click', function(ev){
        ev.preventDefault();
        try {
          if (window.parent && typeof window.parent.goHome === 'function') {
            window.parent.goHome();
            return;
          }
        } catch (err) { /* framed by something else; fall through */ }
        try { window.top.location.href = './'; } catch (err) { window.location.href = './'; }
      });
    }
  }

  // Opened on its own, the back arrow goes to the suite's home screen.
  if (!framed) {
    var sbl = document.getElementById('hdrBack');
    if (sbl) {
      sbl.setAttribute('href', 'app.html');
      sbl.title = 'Home';
      sbl.setAttribute('aria-label', 'Back to the home screen');
    }
  }

  render();
  bootStorage();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Deutsch üben</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap');

:root {
  --ink:    #1a1a1a;
  --paper:  #fffef9;
  --bg:     #f5f0e8;
  --muted:  #888;
  --border: #d8d4cc;
  --de:     #b8860b;
  --de-bg:  #f7efd8;
  --de-dk:  #7a5a08;
  --good:   #4a7c59;
  --good-bg:#cce5d4;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100%; background: var(--bg);
  font-family: 'DM Mono', monospace; color: var(--ink);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}

.page {
  padding: calc(var(--safe-t) + 0.75rem) 1rem calc(var(--safe-b) + 2.5rem);
  max-width: 500px; margin: 0 auto;
}

/* ── header ── */
.page-hdr {
  padding: 1rem 0 1rem;
  border-bottom: 2px solid var(--ink);
  margin-bottom: 1.25rem;
}
.page-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem; color: var(--ink); margin-bottom: 0.35rem;
}
.page-meta {
  display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
  font-size: 0.68rem; color: var(--muted); margin-bottom: 0.5rem;
}
.streak-badge {
  background: var(--de-bg); color: var(--de-dk);
  border: 1px solid var(--de);
  padding: 2px 8px; border-radius: 2px; font-weight: 500;
}
.prog-bar  { height: 2px; background: var(--border); }
.prog-fill { height: 100%; background: var(--de); transition: width 0.4s ease; }

/* ── cards ── */
.card {
  background: var(--paper);
  border: 1.5px solid var(--border);
  border-left: 4px solid var(--de);
  margin-bottom: 0.85rem;
  padding: 0.9rem 1rem;
  transition: opacity 0.2s;
}
.card.card-core  { border-left-color: var(--de); }
.card.card-bonus { border-left-color: var(--border); }
.card.card-done  { border-left-color: var(--good); opacity: 0.72; }

.card-top { display: flex; align-items: flex-start; gap: 0.75rem; }

.card-check {
  width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px;
  border: 2px solid var(--border); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.card-check.checked { background: var(--good); border-color: var(--good); }
.card-check.checked::after { content: '✓'; color: white; font-size: 13px; font-weight: bold; }

.card-info  { flex: 1; min-width: 0; }
.card-title {
  font-size: 0.8rem; font-weight: 500; letter-spacing: 0.04em;
  color: var(--de-dk); margin-bottom: 0.2rem;
  display: flex; align-items: center; gap: 0.5rem;
}
.card-badge {
  font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--bg); color: var(--muted); border: 1px solid var(--border);
  padding: 1px 5px; border-radius: 2px; font-weight: 400;
}
.card-desc { font-size: 0.7rem; color: var(--muted); line-height: 1.55; }

/* ── inputs ── */
.card-inputs { margin-top: 0.85rem; display: flex; flex-direction: column; gap: 0.7rem; }
.field-lbl {
  font-size: 0.6rem; color: var(--muted); letter-spacing: 0.08em;
  text-transform: uppercase; margin-bottom: 3px;
}
.field-inp {
  font-family: 'DM Mono', monospace; font-size: 0.82rem;
  border: none; border-bottom: 1.5px solid var(--border);
  background: transparent; outline: none; color: var(--ink);
  padding: 3px 0; width: 100%;
}
.field-inp:focus { border-bottom-color: var(--de); }
.field-ta {
  font-family: 'DM Mono', monospace; font-size: 0.82rem;
  border: 1.5px solid var(--border); background: var(--bg);
  outline: none; color: var(--ink); padding: 0.5rem;
  width: 100%; resize: vertical; min-height: 72px; line-height: 1.55;
}
.field-ta:focus { border-color: var(--de); }

/* ── timer ── */
.timer-wrap {
  margin-top: 0.85rem; padding-top: 0.75rem;
  border-top: 1px dashed var(--border);
  display: flex; align-items: center; gap: 0.85rem;
}
.timer-display {
  font-size: 2.4rem; font-weight: 400; letter-spacing: -2px;
  color: var(--ink); line-height: 1; min-width: 4.2rem;
  transition: color 0.3s;
}
.timer-display.running { color: var(--de); }
.timer-display.finished { color: var(--good); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
.timer-display.running { animation: pulse 1s ease-in-out infinite; }
.timer-btns { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.timer-start {
  background: var(--de); color: white; border: none;
  font-family: 'DM Mono', monospace; font-size: 0.75rem;
  padding: 0.4rem 0.9rem; cursor: pointer; border-radius: 2px;
}
.timer-start.paused { background: var(--muted); }
.timer-reset {
  background: none; border: 1.5px solid var(--border);
  font-family: 'DM Mono', monospace; font-size: 0.75rem;
  color: var(--muted); padding: 0.4rem 0.75rem; cursor: pointer; border-radius: 2px;
}

/* ── sentences ── */
.sentence-row { display: flex; flex-direction: column; gap: 3px; }
.sentence-prompt { font-size: 0.65rem; color: var(--muted); font-style: italic; }
.sentence-inp {
  font-family: 'DM Mono', monospace; font-size: 0.82rem;
  border: none; border-bottom: 1.5px solid var(--border);
  background: transparent; outline: none; color: var(--ink);
  padding: 3px 0; width: 100%;
}
.sentence-inp:focus { border-bottom-color: var(--de); }

/* ── mark-core button ── */
.mark-core-btn {
  width: 100%; margin-bottom: 0.85rem;
  background: var(--de); color: white; border: none;
  font-family: 'DM Mono', monospace; font-size: 0.8rem;
  padding: 0.7rem 1rem; cursor: pointer; border-radius: 2px;
  letter-spacing: 0.04em;
}
.mark-core-btn:active { opacity: 0.85; }
.mark-core-btn.all-done {
  background: var(--good-bg); color: var(--good);
  border: 1.5px solid var(--good); cursor: default;
}

/* ── section header ── */
.section-hdr {
  font-size: 0.62rem; color: var(--muted); letter-spacing: 0.1em;
  text-transform: uppercase; padding: 0.75rem 0 0.4rem;
  border-top: 1px solid var(--border); margin-top: 0.5rem;
  display: flex; align-items: center; justify-content: space-between;
}
.toggle-btn {
  background: none; border: none; font-family: 'DM Mono', monospace;
  font-size: 0.65rem; color: var(--de); cursor: pointer; padding: 0;
}

/* ── history ── */
.hist-entry {
  border-bottom: 1px solid var(--border);
  padding: 0.7rem 0; cursor: pointer;
}
.hist-entry:last-child { border-bottom: none; }
.hist-date {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.7rem; color: var(--muted);
}
.hist-dots { display: flex; gap: 3px; }
.hist-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
.hist-dot.done { background: var(--good); }
.hist-dot.core { width: 8px; height: 8px; }
.hist-detail {
  font-size: 0.75rem; color: #555; line-height: 1.65;
  padding-top: 0.5rem; border-top: 1px dashed var(--border); margin-top: 0.5rem;
}
.hist-detail em { color: var(--muted); font-style: normal; }

/* ── save indicator ── */
.save-indicator {
  font-size: 0.62rem; color: var(--muted); letter-spacing: 0.06em;
  min-height: 1.2em; text-align: right; padding: 0.25rem 0 0;
}

/* ── PAT modal ── */
#pat-modal {
  display: none; position: fixed; inset: 0;
  background: rgba(245,240,232,0.96);
  align-items: center; justify-content: center;
  z-index: 9999; padding: 1.5rem;
}
#pat-modal.show { display: flex; }
#pat-box {
  background: var(--paper); border: 2px solid var(--ink);
  box-shadow: 5px 5px 0 var(--ink);
  padding: 1.75rem; width: 100%; max-width: 360px;
  display: flex; flex-direction: column; gap: 0.85rem;
}
#pat-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; }
#pat-msg   { font-size: 0.72rem; color: #c0392b; min-height: 1em; }
#pat-input {
  font-family: 'DM Mono', monospace; font-size: 0.82rem;
  border: 2px solid var(--ink); background: var(--bg);
  padding: 0.5rem 0.65rem; outline: none; width: 100%;
}
#pat-hint  { font-size: 0.65rem; color: var(--muted); line-height: 1.5; }
#pat-save  {
  font-family: 'DM Mono', monospace; font-size: 0.8rem;
  background: var(--ink); color: var(--paper); border: none;
  padding: 0.6rem 1.2rem; cursor: pointer; align-self: flex-start; border-radius: 2px;
}
</style>
</head>
<body>

<div id="pat-modal">
  <div id="pat-box">
    <div id="pat-title">GitHub Token</div>
    <div id="pat-msg"></div>
    <input id="pat-input" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false">
    <div id="pat-hint">Same token as the main Home app.</div>
    <button id="pat-save">Save token</button>
  </div>
</div>

<div class="page">
  <div class="page-hdr">
    <div class="page-title">Deutsch üben</div>
    <div class="page-meta">
      <span id="todayDate">—</span>
      <span class="streak-badge" id="streakBadge">🔥 — days</span>
      <span id="progText" style="color:var(--muted)">0/2 core</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>

  <div id="exerciseCards"></div>

  <div class="save-indicator" id="saveIndicator"></div>

  <div class="section-hdr">
    history
    <button class="toggle-btn" id="toggleHist" onclick="toggleHistory()">hide</button>
  </div>
  <div id="histArea"></div>
</div>

<script>
const REPO = 'Jeff-Lynn-SC/todo';
const FILE = 'deutsch.json';
const ghUrl = p => `https://api.github.com/repos/${REPO}/contents/${p}`;

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtKey(k) {
  const [y, m, d] = k.split('-').map(Number);
  return `${DAYS[new Date(y, m-1, d).getDay()]}, ${d} ${MONTHS[m-1]}`;
}
function initDay() {
  return {
    monologue:    { done: false, topic: '', notes: '' },
    sentences:    { done: false, positive: '', negative: '', overall: '' },
    radio:        { done: false, notes: '' },
    conversation: { done: false, notes: '' },
    reading:      { done: false, title: '' },
    tv:           { done: false, title: '' },
    cooking:      { done: false, recipe: '' },
    onboard:      { done: false }
  };
}

// ── PAT / GitHub ──────────────────────────────────
const getPat = () => localStorage.getItem('gh_pat');

function showPat(msg) {
  document.getElementById('pat-modal').classList.add('show');
  document.getElementById('pat-msg').textContent = msg || '';
  setTimeout(() => document.getElementById('pat-input').focus(), 120);
}
document.getElementById('pat-save').addEventListener('click', () => {
  const v = document.getElementById('pat-input').value.trim();
  if (!v) return;
  localStorage.setItem('gh_pat', v);
  document.getElementById('pat-modal').classList.remove('show');
  loadData();
});
document.getElementById('pat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pat-save').click();
});

async function ghGet(path) {
  const pat = getPat();
  if (!pat) { showPat(); return null; }
  const res = await fetch(ghUrl(path), {
    headers: { Authorization: `token ${pat}`, Accept: 'application/vnd.github.v3+json' }
  });
  if (res.status === 401) { localStorage.removeItem('gh_pat'); showPat('Token rejected — please re-enter.'); return null; }
  if (!res.ok) return null;
  return res.json();
}
async function ghPut(path, data, msg) {
  const pat = getPat();
  if (!pat) return null;
  const current = await ghGet(path);
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const body = { message: msg, content };
  if (current) body.sha = current.sha;
  const res = await fetch(ghUrl(path), {
    method: 'PUT',
    headers: {
      Authorization: `token ${pat}`,
      Accept: 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  return res.ok ? res.json() : null;
}

// ── timer state (survives card re-renders) ────────
const timer = { running: false, seconds: 60, intervalId: null };

function fmtSecs(s) {
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function timerTick() {
  timer.seconds--;
  const disp = document.getElementById('mono-timer-disp');
  if (disp) disp.textContent = fmtSecs(timer.seconds);
  if (timer.seconds <= 0) {
    timerStop();
    playBeep();
    // Auto-mark both core exercises done
    const key = todayKey();
    store[key].monologue.done = true;
    store[key].sentences.done = true;
    scheduleSave();
    render();
  }
}

function timerStart() {
  if (timer.running || timer.seconds <= 0) return;
  timer.running = true;
  timer.intervalId = setInterval(timerTick, 1000);
  updateTimerDOM();
}

function timerPause() {
  timer.running = false;
  clearInterval(timer.intervalId);
  timer.intervalId = null;
  updateTimerDOM();
}

function timerReset() {
  timerPause();
  timer.seconds = 60;
  updateTimerDOM();
}

function timerStop() {
  timer.running = false;
  if (timer.intervalId) clearInterval(timer.intervalId);
  timer.intervalId = null;
}

function updateTimerDOM() {
  const disp  = document.getElementById('mono-timer-disp');
  const start = document.getElementById('mono-timer-start');
  const reset = document.getElementById('mono-timer-reset');
  if (!disp) return;
  disp.textContent = fmtSecs(timer.seconds);
  disp.className = 'timer-display' + (timer.running ? ' running' : timer.seconds === 0 ? ' finished' : '');
  if (start) {
    start.textContent = timer.running ? 'pause' : 'start';
    start.className = 'timer-start' + (timer.running ? ' paused' : '');
  }
  if (reset) reset.style.display = (timer.seconds < 60 && !timer.running) ? '' : 'none';
}

function playBeep() {
  try {
    const ctx  = new (window.AudioContext || window.webkitAudioContext)();
    const gain = ctx.createGain();
    gain.connect(ctx.destination);
    [0, 0.18, 0.36].forEach(t => {
      const osc = ctx.createOscillator();
      osc.connect(gain);
      osc.frequency.value = 660;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.25, ctx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.15);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + 0.15);
    });
  } catch {}
}

// ── store ─────────────────────────────────────────
let store = {};
let histVisible = true;
let saveTimer = null;

// ── load ──────────────────────────────────────────
async function loadData() {
  if (!getPat()) { showPat(); return; }
  const cached = localStorage.getItem('deutsch_data');
  if (cached) { try { store = JSON.parse(cached); } catch { store = {}; } }
  const key = todayKey();
  if (!store[key]) store[key] = initDay();
  render();

  const meta = await ghGet(FILE);
  if (meta) {
    try {
      const remote = JSON.parse(atob(meta.content.replace(/\n/g, '')));
      Object.keys(remote).forEach(k => { if (k !== key) store[k] = remote[k]; });
      if (remote[key]) {
        const loc = store[key], rem = remote[key];
        store[key] = {
          monologue: rem.monologue?.notes?.length > (loc.monologue?.notes?.length || 0) ? rem.monologue : loc.monologue,
          cooking:   rem.cooking?.recipe ? rem.cooking : loc.cooking,
          onboard:   { done: loc.onboard?.done || rem.onboard?.done },
          sentences: rem.sentences?.positive ? rem.sentences : loc.sentences
        };
      }
    } catch {}
    localStorage.setItem('deutsch_data', JSON.stringify(store));
    render();
  }
}

// ── save ──────────────────────────────────────────
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  document.getElementById('saveIndicator').textContent = '…';
  saveTimer = setTimeout(doSave, 1400);
}
async function doSave() {
  localStorage.setItem('deutsch_data', JSON.stringify(store));
  const ok = await ghPut(FILE, store, 'update deutsch journal');
  const el = document.getElementById('saveIndicator');
  el.textContent = ok ? 'saved ✓' : 'save failed';
  setTimeout(() => { el.textContent = ''; }, 2500);
}

// ── render ────────────────────────────────────────
function updateMeta() {
  const key = todayKey();
  const d   = store[key] || initDay();
  const coreDone  = [d.monologue.done, d.sentences.done].filter(Boolean).length;
  document.getElementById('progText').textContent  = `${coreDone}/2 core`;
  document.getElementById('progFill').style.width  = `${coreDone / 2 * 100}%`;
  document.getElementById('streakBadge').textContent = `🔥 ${calcStreak()} days`;
}

function calcStreak() {
  const today = todayKey();
  let streak = 0;
  const check = new Date();
  for (let i = 0; i < 365; i++) {
    const k = `${check.getFullYear()}-${String(check.getMonth()+1).padStart(2,'0')}-${String(check.getDate()).padStart(2,'0')}`;
    const d = store[k];
    const complete = d?.monologue?.done && d?.sentences?.done;
    if (complete) {
      streak++;
    } else if (k !== today) {
      break;
    }
    check.setDate(check.getDate() - 1);
  }
  return streak;
}

function render() {
  document.getElementById('todayDate').textContent = fmtKey(todayKey());
  updateMeta();
  renderCards();
  if (histVisible) renderHistory();
}

function renderCards() {
  const key  = todayKey();
  const data = store[key];
  const c    = document.getElementById('exerciseCards');
  c.innerHTML = '';

  // Mark core done button
  const coreDone = data.monologue.done && data.sentences.done;
  const coreBtn  = document.createElement('button');
  coreBtn.className   = 'mark-core-btn' + (coreDone ? ' all-done' : '');
  coreBtn.textContent = coreDone ? '✓ Core exercises done today' : 'Mark both core exercises done';
  if (!coreDone) {
    coreBtn.addEventListener('click', () => {
      data.monologue.done = true;
      data.sentences.done = true;
      scheduleSave(); render();
    });
  }
  c.appendChild(coreBtn);

  c.appendChild(makeMonologueCard(data));
  c.appendChild(makeSentencesCard(data));
  c.appendChild(makeRadioCard(data));
  c.appendChild(makeConversationCard(data));
  c.appendChild(makeReadingCard(data));
  c.appendChild(makeTvCard(data));
  c.appendChild(makeCookingCard(data));
  c.appendChild(makeOnboardCard(data));
}

// ── card builders ─────────────────────────────────
function baseCard(isDone, isBonus) {
  const card = document.createElement('div');
  card.className = 'card' + (isDone ? ' card-done' : isBonus ? ' card-bonus' : ' card-core');
  return card;
}

function cardTop(emoji, titleText, badgeText, descText, isDone, onCheck) {
  const top   = document.createElement('div');
  top.className = 'card-top';

  const check = document.createElement('div');
  check.className = 'card-check' + (isDone ? ' checked' : '');
  check.addEventListener('click', onCheck);

  const info  = document.createElement('div');
  info.className = 'card-info';

  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = `${emoji} ${titleText}`;
  if (badgeText) {
    const badge = document.createElement('span');
    badge.className   = 'card-badge';
    badge.textContent = badgeText;
    title.appendChild(badge);
  }

  const desc = document.createElement('div');
  desc.className   = 'card-desc';
  desc.textContent = descText;

  info.appendChild(title);
  info.appendChild(desc);
  top.appendChild(check);
  top.appendChild(info);
  return top;
}

function makeMonologueCard(data) {
  const m    = data.monologue;
  const card = baseCard(m.done, false);
  card.appendChild(cardTop(
    '🎙', 'Einminütiges Gespräch', 'CORE',
    'Wähle ein Thema und sprich eine Minute lang auf Deutsch — laut oder im Kopf.',
    m.done,
    () => { data.monologue.done = !data.monologue.done; scheduleSave(); render(); }
  ));

  // Timer
  const timerWrap = document.createElement('div');
  timerWrap.className = 'timer-wrap';

  const disp = document.createElement('div');
  disp.id = 'mono-timer-disp';
  disp.className = 'timer-display' + (timer.running ? ' running' : timer.seconds === 0 ? ' finished' : '');
  disp.textContent = fmtSecs(timer.seconds);

  const btns = document.createElement('div');
  btns.className = 'timer-btns';

  const startBtn = document.createElement('button');
  startBtn.id = 'mono-timer-start';
  startBtn.className = 'timer-start' + (timer.running ? ' paused' : '');
  startBtn.textContent = timer.running ? 'pause' : 'start';
  startBtn.addEventListener('click', () => { timer.running ? timerPause() : timerStart(); });

  const resetBtn = document.createElement('button');
  resetBtn.id = 'mono-timer-reset';
  resetBtn.className = 'timer-reset';
  resetBtn.textContent = 'reset';
  resetBtn.style.display = (timer.seconds < 60 && !timer.running) ? '' : 'none';
  resetBtn.addEventListener('click', timerReset);

  btns.appendChild(startBtn);
  btns.appendChild(resetBtn);
  timerWrap.appendChild(disp);
  timerWrap.appendChild(btns);
  card.appendChild(timerWrap);

  // Topic + notes
  const inputs = document.createElement('div');
  inputs.className = 'card-inputs';
  inputs.style.marginTop = '0.75rem';

  const tg = document.createElement('div');
  tg.innerHTML = '<div class="field-lbl">Thema / Topic</div>';
  const ti = document.createElement('input');
  ti.className   = 'field-inp';
  ti.placeholder = 'e.g. Mein Wochenende, Das Wetter, Meine Familie…';
  ti.value       = m.topic || '';
  ti.addEventListener('input', () => { data.monologue.topic = ti.value; scheduleSave(); });
  tg.appendChild(ti);

  inputs.appendChild(ng);
  card.appendChild(inputs);
  return card;
}

// ── history ────────────────────────────────────────
function toggleHistory() {
  histVisible = !histVisible;
  document.getElementById('histArea').style.display = histVisible ? '' : 'none';
  document.getElementById('toggleHist').textContent = histVisible ? 'hide' : 'show';
  if (histVisible) renderHistory();
}

function renderHistory() {
  const area   = document.getElementById('histArea');
  const todKey = todayKey();
  const keys   = Object.keys(store).sort().reverse().filter(k => k !== todKey);
  if (keys.length === 0) {
    area.innerHTML = '<div style="font-size:0.75rem;color:var(--muted);padding:0.75rem 0">No previous entries yet.</div>';
    return;
  }
  area.innerHTML = '';
  keys.forEach(k => {
    if (!store[k]) store[k] = initDay();
    const d     = store[k];
    const entry = document.createElement('div');
    entry.className = 'hist-entry';

    // Date row with dots
    const dateRow = document.createElement('div');
    dateRow.className = 'hist-date';
    dateRow.textContent = fmtKey(k);
    const dots = document.createElement('div');
    dots.className = 'hist-dots';
    [
      { v: d.monologue?.done,    core: true },
      { v: d.sentences?.done,    core: true },
      { v: d.radio?.done,        core: false },
      { v: d.conversation?.done, core: false },
      { v: d.reading?.done,      core: false },
      { v: d.tv?.done,           core: false },
      { v: d.cooking?.done,      core: false },
      { v: d.onboard?.done,      core: false }
    ].forEach(({ v, core }) => {
      const dot = document.createElement('div');
      dot.className = 'hist-dot' + (v ? ' done' : '') + (core ? ' core' : '');
      dots.appendChild(dot);
    });
    dateRow.appendChild(dots);
    entry.appendChild(dateRow);

    // Tap to expand editable form
    dateRow.style.cursor = 'pointer';
    dateRow.addEventListener('click', () => {
      const existing = entry.querySelector('.hist-edit');
      if (existing) { existing.remove(); return; }
      entry.appendChild(buildHistEdit(k, d, entry));
    });

    area.appendChild(entry);
  });
}

function buildHistEdit(k, d, entry) {
  const wrap = document.createElement('div');
  wrap.className = 'hist-edit';
  wrap.style.cssText = 'padding-top:0.6rem;border-top:1px dashed var(--border);margin-top:0.5rem;display:flex;flex-direction:column;gap:0.65rem;';

  function field(labelText, val, onInput, isArea) {
    const g = document.createElement('div');
    const l = document.createElement('div');
    l.className = 'field-lbl'; l.textContent = labelText;
    const inp = document.createElement(isArea ? 'textarea' : 'input');
    inp.className = isArea ? 'field-ta' : 'field-inp';
    inp.value = val || '';
    if (isArea) inp.style.minHeight = '56px';
    inp.addEventListener('input', () => { onInput(inp.value); scheduleSave(); });
    g.appendChild(l); g.appendChild(inp);
    return g;
  }

  // Monologue done toggle
  const mRow = document.createElement('div');
  mRow.style.cssText = 'display:flex;align-items:center;gap:0.6rem;';
  const mCheck = document.createElement('div');
  mCheck.className = 'card-check' + (d.monologue?.done ? ' checked' : '');
  mCheck.style.cssText = 'width:18px;height:18px;flex-shrink:0;';
  mCheck.addEventListener('click', () => {
    d.monologue.done = !d.monologue.done;
    mCheck.className = 'card-check' + (d.monologue.done ? ' checked' : '');
    scheduleSave(); renderHistory();
  });
  const mLbl = document.createElement('span');
  mLbl.style.cssText = 'font-size:0.72rem;color:var(--de-dk);font-weight:500;';
  mLbl.textContent = '🎙 Monologue done';
  mRow.appendChild(mCheck); mRow.appendChild(mLbl);
  wrap.appendChild(mRow);

  wrap.appendChild(field('Thema / Topic',    d.monologue?.topic, v => { d.monologue.topic = v; }));
  wrap.appendChild(field('Notizen / Notes',  d.monologue?.notes, v => { d.monologue.notes = v; }, true));

  // Sentences done toggle
  const sRow = document.createElement('div');
  sRow.style.cssText = 'display:flex;align-items:center;gap:0.6rem;margin-top:0.2rem;';
  const sCheck = document.createElement('div');
  sCheck.className = 'card-check' + (d.sentences?.done ? ' checked' : '');
  sCheck.style.cssText = 'width:18px;height:18px;flex-shrink:0;';
  sCheck.addEventListener('click', () => {
    d.sentences.done = !d.sentences.done;
    sCheck.className = 'card-check' + (d.sentences.done ? ' checked' : '');
    scheduleSave(); renderHistory();
  });
  const sLbl = document.createElement('span');
  sLbl.style.cssText = 'font-size:0.72rem;color:var(--de-dk);font-weight:500;';
  sLbl.textContent = '🌙 Sentences done';
  sRow.appendChild(sCheck); sRow.appendChild(sLbl);
  wrap.appendChild(sRow);

  wrap.appendChild(field('Etwas Positives heute war…',   d.sentences?.positive, v => { d.sentences.positive = v; }));
  wrap.appendChild(field('Etwas Schwieriges heute war…', d.sentences?.negative, v => { d.sentences.negative = v; }));
  wrap.appendChild(field('Insgesamt war heute…',         d.sentences?.overall,  v => { d.sentences.overall  = v; }));

  // Bonus toggles
  [
    { key: 'radio',        emoji: '📻', label: 'Radio',         noteKey: 'notes' },
    { key: 'conversation', emoji: '💬', label: 'Gespräche',     noteKey: 'notes' },
    { key: 'reading',      emoji: '📖', label: 'Lesen',         noteKey: 'title' },
    { key: 'tv',           emoji: '📺', label: 'Fernsehen',     noteKey: 'title' },
    { key: 'cooking',      emoji: '🍳', label: 'Kochen',        noteKey: 'recipe' },
    { key: 'onboard',      emoji: '🚂', label: 'Unterwegs',     noteKey: null }
  ].forEach(({ key, emoji, label, noteKey }) => {
    if (!d[key]) d[key] = { done: false };
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:0.6rem;';
    const chk = document.createElement('div');
    chk.className = 'card-check' + (d[key].done ? ' checked' : '');
    chk.style.cssText = 'width:18px;height:18px;flex-shrink:0;';
    chk.addEventListener('click', () => {
      d[key].done = !d[key].done;
      chk.className = 'card-check' + (d[key].done ? ' checked' : '');
      scheduleSave();
    });
    const lbl = document.createElement('span');
    lbl.style.cssText = 'font-size:0.72rem;color:var(--muted);';
    lbl.textContent = `${emoji} ${label}`;
    row.appendChild(chk); row.appendChild(lbl);
    wrap.appendChild(row);
    if (noteKey) {
      wrap.appendChild(field('', d[key][noteKey], v => { d[key][noteKey] = v; }));
    }
  });

  return wrap;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── init ──────────────────────────────────────────
const nd = new Date();
document.getElementById('todayDate').textContent = `${DAYS[nd.getDay()]}, ${nd.getDate()} ${MONTHS[nd.getMonth()]}`;
if (!getPat()) showPat(); else loadData();

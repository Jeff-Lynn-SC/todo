<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blood Pressure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap');

:root {
  --ink:    #1a1a1a;
  --paper:  #fffef9;
  --bg:     #f5f0e8;
  --muted:  #888;
  --border: #d8d4cc;
  --en:     #b8860b;
  --en-bg:  #f7efd8;
  --en-dk:  #7a5a08;
  --sys:    #c0392b;
  --dia:    #2980b9;
  --hr:     #4a7c59;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100%; background: var(--bg);
  font-family: 'DM Mono', monospace; color: var(--ink);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.page {
  padding: calc(var(--safe-t) + 0.75rem) 1rem calc(var(--safe-b) + 2.5rem);
  max-width: 500px; margin: 0 auto;
}

/* ── header ── */
.page-hdr {
  padding: 1rem 0; border-bottom: 2px solid var(--ink); margin-bottom: 1.25rem;
}
.page-title {
  font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 0.35rem;
}
.page-meta {
  display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
  font-size: 0.68rem; color: var(--muted);
}

/* ── cards ── */
.card {
  background: var(--paper); border: 1.5px solid var(--border);
  border-left: 4px solid var(--en); margin-bottom: 0.85rem; padding: 0.9rem 1rem;
}
.card-title-row {
  font-size: 0.72rem; font-weight: 500; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--en-dk); margin-bottom: 0.75rem;
}

/* ── inputs ── */
.field-group { display: flex; flex-direction: column; gap: 3px; }
.field-lbl {
  font-size: 0.6rem; color: var(--muted); letter-spacing: 0.08em;
  text-transform: uppercase;
}
.field-inp {
  font-family: 'DM Mono', monospace; font-size: 0.82rem;
  border: none; border-bottom: 1.5px solid var(--border);
  background: transparent; outline: none; color: var(--ink); padding: 3px 0; width: 100%;
}
.field-inp:focus { border-bottom-color: var(--en); }
.field-inp.error { border-bottom-color: var(--sys); }
.field-row { display: flex; gap: 0.75rem; }
.field-row .field-group { flex: 1; }
.field-error {
  font-size: 0.62rem; color: var(--sys); min-height: 1em; margin-top: 0.25rem;
}
.save-btn {
  width: 100%; margin-top: 0.85rem;
  background: var(--en); color: white; border: none;
  font-family: 'DM Mono', monospace; font-size: 0.8rem;
  padding: 0.7rem 1rem; cursor: pointer; border-radius: 2px; letter-spacing: 0.04em;
}
.save-btn:active { opacity: 0.85; }

/* ── tab bar ── */
.tab-bar {
  display: flex; border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin-bottom: 1rem; margin-top: 0.25rem;
}
.tab-btn {
  flex: 1; background: none; border: none; border-bottom: 2px solid transparent;
  font-family: 'DM Mono', monospace; font-size: 0.65rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); padding: 0.55rem 0; cursor: pointer; transition: color 0.15s;
}
.tab-btn.active { color: var(--en-dk); border-bottom-color: var(--en); font-weight: 500; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── time range toggle ── */
.range-toggle { display: flex; gap: 0; margin-bottom: 0.85rem; }
.range-btn {
  background: none; border: 1.5px solid var(--border);
  border-right: none; font-family: 'DM Mono', monospace;
  font-size: 0.65rem; color: var(--muted); padding: 0.3rem 0.75rem; cursor: pointer;
}
.range-btn:last-child { border-right: 1.5px solid var(--border); }
.range-btn.active { background: var(--en); color: white; border-color: var(--en); }

/* ── chart ── */
.chart-wrap {
  background: var(--paper); border: 1.5px solid var(--border);
  padding: 0.75rem; margin-bottom: 0.85rem;
}
.chart-svg { width: 100%; height: auto; display: block; }
.chart-legend {
  display: flex; gap: 1.2rem; justify-content: center;
  padding-top: 0.5rem; font-size: 0.62rem; color: var(--muted);
}
.legend-item { display: flex; align-items: center; gap: 0.3rem; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.chart-empty {
  text-align: center; font-size: 0.75rem; color: var(--muted);
  padding: 2rem 0;
}

/* ── history rows ── */
.hist-row {
  background: var(--paper); border: 1.5px solid var(--border);
  border-left: 4px solid var(--border);
  padding: 0.65rem 0.85rem; margin-bottom: 0.5rem;
}
.hist-main {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
}
.hist-datetime { font-size: 0.68rem; color: var(--muted); flex: 1; min-width: 0; }
.hist-values { font-size: 0.78rem; font-weight: 500; white-space: nowrap; }
.hist-delete {
  background: none; border: none; color: var(--border); cursor: pointer;
  font-size: 1rem; line-height: 1; padding: 0 0.2rem; flex-shrink: 0;
}
.hist-delete:hover { color: var(--sys); }
.hist-notes { font-size: 0.65rem; color: var(--muted); font-style: italic; margin-top: 0.3rem; }
.card-badge {
  font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase;
  border: 1px solid currentColor; padding: 1px 5px; border-radius: 2px; font-weight: 400;
  white-space: nowrap; flex-shrink: 0;
}

/* ── report ── */
.report-section { margin-bottom: 1.25rem; }
.report-label {
  font-size: 0.62rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
  padding: 0.5rem 0 0.4rem; border-top: 1px solid var(--border);
}
.report-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; padding: 0.5rem 0;
}
.report-cell {
  background: var(--paper); border: 1.5px solid var(--border);
  padding: 0.55rem 0.65rem;
}
.report-cell-lbl { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.report-cell-val { font-size: 1rem; font-weight: 500; margin-top: 0.15rem; }
.report-empty { font-size: 0.75rem; color: var(--muted); padding: 0.5rem 0; }
.export-btn {
  background: none; border: 1.5px solid var(--en); color: var(--en-dk);
  font-family: 'DM Mono', monospace; font-size: 0.72rem;
  padding: 0.45rem 1rem; cursor: pointer; border-radius: 2px; margin-top: 0.5rem;
}
.export-btn:active { background: var(--en-bg); }

/* ── save indicator ── */
.save-indicator {
  font-size: 0.62rem; color: var(--muted); letter-spacing: 0.06em;
  min-height: 1.2em; text-align: right; padding: 0.25rem 0 0;
}

/* ── modals ── */
.modal {
  display: none; position: fixed; inset: 0;
  background: rgba(245,240,232,0.96);
  align-items: center; justify-content: center; z-index: 9999; padding: 1.5rem;
}
.modal.show { display: flex; }
.modal-box {
  background: var(--paper); border: 2px solid var(--ink);
  box-shadow: 5px 5px 0 var(--ink); padding: 1.75rem; width: 100%; max-width: 360px;
  display: flex; flex-direction: column; gap: 0.85rem;
}
.modal-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; }
.modal-msg   { font-size: 0.72rem; color: var(--sys); min-height: 1em; }
.modal-inp {
  font-family: 'DM Mono', monospace; font-size: 0.82rem;
  border: 2px solid var(--ink); background: var(--bg);
  padding: 0.5rem 0.65rem; outline: none; width: 100%;
}
.modal-hint { font-size: 0.65rem; color: var(--muted); line-height: 1.5; }
.modal-save {
  font-family: 'DM Mono', monospace; font-size: 0.8rem;
  background: var(--ink); color: var(--paper); border: none;
  padding: 0.6rem 1.2rem; cursor: pointer; align-self: flex-start; border-radius: 2px;
}

/* ── empty state ── */
.empty-state {
  font-size: 0.75rem; color: var(--muted); padding: 1.5rem 0; text-align: center;
}
</style>
</head>
<body>

<!-- GitHub PAT modal -->
<div id="pat-modal" class="modal">
  <div class="modal-box">
    <div class="modal-title">GitHub Token</div>
    <div class="modal-msg" id="pat-msg"></div>
    <input id="pat-input" class="modal-inp" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false">
    <div class="modal-hint" id="pat-hint">Same token as the main Home app.</div>
    <button id="pat-save" class="modal-save">Save token</button>
  </div>
</div>

<div class="page">
  <div class="page-hdr">
    <div class="page-title">Blood Pressure</div>
    <div class="page-meta">
      <span id="todayMeta">—</span>
      <span id="todayCount">0 readings today</span>
      <span style="font-size:0.58rem;color:var(--muted)">v1.0</span>
    </div>
  </div>

  <!-- Entry form -->
  <div class="card" id="entryCard">
    <div class="card-title-row">New Reading</div>
    <div style="display:flex;flex-direction:column;gap:0.7rem;">
      <div class="field-group">
        <div class="field-lbl">Date &amp; Time</div>
        <input id="inp-datetime" class="field-inp" type="datetime-local">
      </div>
      <div class="field-row">
        <div class="field-group">
          <div class="field-lbl">Systolic (mmHg)</div>
          <input id="inp-sys" class="field-inp" type="number" placeholder="120" min="60" max="250">
        </div>
        <div class="field-group">
          <div class="field-lbl">Diastolic (mmHg)</div>
          <input id="inp-dia" class="field-inp" type="number" placeholder="80" min="40" max="150">
        </div>
      </div>
      <div class="field-group">
        <div class="field-lbl">Heart Rate (bpm)</div>
        <input id="inp-hr" class="field-inp" type="number" placeholder="72" min="30" max="200">
      </div>
      <div class="field-group">
        <div class="field-lbl">Notes (optional)</div>
        <input id="inp-notes" class="field-inp" type="text" placeholder="After walk, morning, etc.">
      </div>
      <div class="field-error" id="form-error"></div>
      <button class="save-btn" id="save-btn">Save reading</button>
    </div>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="graph">graph</button>
    <button class="tab-btn" data-tab="history">history</button>
    <button class="tab-btn" data-tab="report">report</button>
  </div>

  <!-- Graph tab -->
  <div class="tab-panel active" id="tab-graph">
    <div class="range-toggle">
      <button class="range-btn" data-range="7">7d</button>
      <button class="range-btn active" data-range="30">30d</button>
      <button class="range-btn" data-range="all">all</button>
    </div>
    <div class="chart-wrap" id="chart-wrap">
      <div class="chart-empty" id="chart-empty">No readings yet</div>
    </div>
  </div>

  <!-- History tab -->
  <div class="tab-panel" id="tab-history">
    <div id="history-list"></div>
  </div>

  <!-- Report tab -->
  <div class="tab-panel" id="tab-report">
    <div id="report-content"></div>
  </div>

  <div class="save-indicator" id="saveIndicator"></div>
</div>

<script>
const REPO    = 'Jeff-Lynn-SC/todo';
const FILE    = 'bp.json';
const CACHE_KEY = 'bp_data';
const ghUrl = p => `https://api.github.com/repos/${REPO}/contents/${p}`;

// ── PAT ──────────────────────────────────────────
const getPat = () => localStorage.getItem('gh_pat');
function showPat(msg) {
  document.getElementById('pat-modal').classList.add('show');
  document.getElementById('pat-msg').textContent = msg || '';
  setTimeout(() => document.getElementById('pat-input').focus(), 120);
}
document.getElementById('pat-save').addEventListener('click', () => {
  const v = document.getElementById('pat-input').value.trim();
  if (!v) return;
  localStorage.setItem('gh_pat', v);
  document.getElementById('pat-modal').classList.remove('show');
  loadData();
});
document.getElementById('pat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('pat-save').click();
});

// ── GitHub ────────────────────────────────────────
async function ghGet(path) {
  const pat = getPat();
  if (!pat) { showPat(); return null; }
  const res = await fetch(ghUrl(path), {
    headers: { Authorization: `token ${pat}`, Accept: 'application/vnd.github.v3+json' }
  });
  if (res.status === 401) { localStorage.removeItem('gh_pat'); showPat('Token rejected — please re-enter.'); return null; }
  if (res.status === 404) return null; // file doesn't exist yet
  if (!res.ok) { setSaveIndicator(`GitHub error ${res.status}`); return null; }
  return res.json();
}
async function ghPut(path, data, msg) {
  const pat = getPat(); if (!pat) return null;
  const current = await ghGet(path);
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const body = { message: msg, content };
  if (current && current.sha) body.sha = current.sha;
  const res = await fetch(ghUrl(path), {
    method: 'PUT',
    headers: { Authorization: `token ${pat}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return res.ok ? res.json() : null;
}

// ── Store ─────────────────────────────────────────
let readings = []; // sorted ascending by datetime
let saveTimer = null;

function setSaveIndicator(text) {
  document.getElementById('saveIndicator').textContent = text;
}

function saveLocal() {
  localStorage.setItem(CACHE_KEY, JSON.stringify(readings));
}

function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  setSaveIndicator('…');
  saveTimer = setTimeout(doSave, 1400);
}

async function doSave() {
  saveLocal();
  const ok = await ghPut(FILE, readings, 'update bp readings');
  setSaveIndicator(ok ? 'saved ✓' : 'save failed');
  setTimeout(() => setSaveIndicator(''), 2500);
}

function mergeReadings(local, remote) {
  // Remote wins: start with remote, then add any local IDs not in remote
  const remoteIds = new Set(remote.map(r => r.id));
  const merged = [...remote];
  local.forEach(r => {
    if (!remoteIds.has(r.id)) merged.push(r);
  });
  merged.sort((a, b) => a.datetime.localeCompare(b.datetime));
  return merged;
}

async function loadData() {
  if (!getPat()) { showPat(); return; }

  // Show from cache first
  const cached = localStorage.getItem(CACHE_KEY);
  if (cached) {
    try { readings = JSON.parse(cached); } catch { readings = []; }
    render();
  }

  // Fetch from GitHub and merge
  const meta = await ghGet(FILE);
  if (meta && meta.content) {
    try {
      const remote = JSON.parse(decodeURIComponent(escape(atob(meta.content.replace(/[\n\r\s]/g, '')))));
      if (Array.isArray(remote)) {
        readings = mergeReadings(readings, remote);
        saveLocal();
        render();
      }
    } catch {}
  }
}

// ── Data helpers ───────────────────────────────────
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function nowIso() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function fmtDatetime(dt) {
  const d = new Date(dt);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return `${days[d.getDay()]} ${months[d.getMonth()]} ${d.getDate()}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function fmtDateOnly(dt) {
  const d = new Date(dt);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getDate()}`;
}

function classify(sys, dia) {
  if (sys > 180 || dia > 120) return { label: 'Crisis',   color: '#8e1a1a' };
  if (sys >= 140 || dia >= 90) return { label: 'High II',  color: '#c0392b' };
  if (sys >= 130 || dia >= 80) return { label: 'High I',   color: '#e67e22' };
  if (sys >= 120 && dia < 80)  return { label: 'Elevated', color: '#f0a500' };
  return                               { label: 'Normal',   color: '#4a7c59' };
}

function readingsForRange(range) {
  if (range === 'all') return readings;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - parseInt(range));
  const pad = n => String(n).padStart(2,'0');
  const cutStr = `${cutoff.getFullYear()}-${pad(cutoff.getMonth()+1)}-${pad(cutoff.getDate())}T${pad(cutoff.getHours())}:${pad(cutoff.getMinutes())}`;
  return readings.filter(r => r.datetime >= cutStr);
}

function todayReadings() {
  const today = todayStr();
  return readings.filter(r => r.datetime.startsWith(today));
}

// ── Stats ──────────────────────────────────────────
function computeStats(rs) {
  if (!rs.length) return null;
  const sysList = rs.map(r => r.systolic);
  const diaList = rs.map(r => r.diastolic);
  const hrList  = rs.filter(r => r.heartRate).map(r => r.heartRate);
  return {
    count:   rs.length,
    avgSys:  Math.round(sysList.reduce((a,b) => a+b, 0) / sysList.length),
    avgDia:  Math.round(diaList.reduce((a,b) => a+b, 0) / diaList.length),
    avgHr:   hrList.length ? Math.round(hrList.reduce((a,b) => a+b, 0) / hrList.length) : null,
    minSys:  Math.min(...sysList),
    maxSys:  Math.max(...sysList),
    minDia:  Math.min(...diaList),
    maxDia:  Math.max(...diaList)
  };
}

// ── Render ─────────────────────────────────────────
let activeTab  = 'graph';
let activeRange = '30';

function render() {
  updateHeader();
  if (activeTab === 'graph')   renderGraph();
  if (activeTab === 'history') renderHistory();
  if (activeTab === 'report')  renderReport();
}

function updateHeader() {
  const today = todayStr();
  const d = new Date();
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('todayMeta').textContent = `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
  const n = todayReadings().length;
  document.getElementById('todayCount').textContent = `${n} reading${n !== 1 ? 's' : ''} today`;
}

// ── Graph ──────────────────────────────────────────
function renderGraph() {
  const wrap = document.getElementById('chart-wrap');
  const rs = readingsForRange(activeRange);

  // Clear wrap
  while (wrap.firstChild) wrap.removeChild(wrap.firstChild);

  if (!rs.length) {
    const empty = document.createElement('div');
    empty.className = 'chart-empty';
    empty.textContent = 'No readings yet';
    wrap.appendChild(empty);
    return;
  }

  const W = 360, H = 200;
  const ML = 38, MR = 8, MT = 10, MB = 28;
  const plotW = W - ML - MR;
  const plotH = H - MT - MB;

  // Y scale
  const allVals = rs.flatMap(r => [r.systolic, r.diastolic, r.heartRate].filter(Boolean));
  const yMin = Math.floor(Math.min(...allVals) / 10) * 10 - 10;
  const yMax = Math.ceil(Math.max(...allVals) / 10) * 10 + 10;
  const yRange = yMax - yMin;

  function xPos(i) { return ML + (rs.length === 1 ? plotW / 2 : i / (rs.length - 1) * plotW); }
  function yPos(v) { return MT + plotH - ((v - yMin) / yRange * plotH); }

  const NS = 'http://www.w3.org/2000/svg';

  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
    return e;
  }

  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart-svg' });

  // Reference lines at 120 and 80
  [120, 80].forEach(ref => {
    if (ref < yMin || ref > yMax) return;
    const y = yPos(ref);
    const line = el('line', { x1: ML, y1: y, x2: W - MR, y2: y, stroke: '#ccc', 'stroke-dasharray': '3 3', 'stroke-width': '1' });
    svg.appendChild(line);
    const lbl = el('text', { x: ML - 2, y: y + 4, 'text-anchor': 'end', 'font-size': '8', fill: '#aaa', 'font-family': 'DM Mono, monospace' });
    lbl.textContent = String(ref);
    svg.appendChild(lbl);
  });

  // Y axis labels every 20
  for (let v = Math.ceil(yMin / 20) * 20; v <= yMax; v += 20) {
    const y = yPos(v);
    const lbl = el('text', { x: ML - 2, y: y + 4, 'text-anchor': 'end', 'font-size': '8', fill: '#bbb', 'font-family': 'DM Mono, monospace' });
    lbl.textContent = String(v);
    svg.appendChild(lbl);
  }

  // X axis labels: first, middle, last
  const xIndices = rs.length === 1 ? [0] : [0, Math.floor((rs.length - 1) / 2), rs.length - 1];
  const seenX = new Set();
  xIndices.forEach(i => {
    if (seenX.has(i)) return; seenX.add(i);
    const x = xPos(i);
    const lbl = el('text', { x, y: H - 4, 'text-anchor': 'middle', 'font-size': '7.5', fill: '#aaa', 'font-family': 'DM Mono, monospace' });
    lbl.textContent = fmtDateOnly(rs[i].datetime);
    svg.appendChild(lbl);
  });

  // Draw lines and dots
  const series = [
    { key: 'systolic',  color: 'var(--sys)', cssColor: '#c0392b' },
    { key: 'diastolic', color: 'var(--dia)', cssColor: '#2980b9' },
    { key: 'heartRate', color: 'var(--hr)',  cssColor: '#4a7c59' }
  ];

  series.forEach(({ key, cssColor }) => {
    const pts = rs.map((r, i) => r[key] ? `${xPos(i)},${yPos(r[key])}` : null).filter(Boolean);
    if (pts.length < 2) return;
    const polyline = el('polyline', {
      points: pts.join(' '),
      fill: 'none',
      stroke: cssColor,
      'stroke-width': '1.5',
      'stroke-linejoin': 'round',
      'stroke-linecap': 'round'
    });
    svg.appendChild(polyline);
  });

  // Dots on top
  series.forEach(({ key, cssColor }) => {
    rs.forEach((r, i) => {
      if (!r[key]) return;
      const circle = el('circle', {
        cx: xPos(i),
        cy: yPos(r[key]),
        r: '3',
        fill: cssColor
      });
      svg.appendChild(circle);
    });
  });

  wrap.appendChild(svg);

  // Legend
  const legend = document.createElement('div');
  legend.className = 'chart-legend';
  [
    { label: 'sys', color: '#c0392b' },
    { label: 'dia', color: '#2980b9' },
    { label: 'hr',  color: '#4a7c59' }
  ].forEach(({ label, color }) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    const dot = document.createElement('div');
    dot.className = 'legend-dot';
    dot.style.background = color;
    const txt = document.createTextNode(label);
    item.appendChild(dot);
    item.appendChild(txt);
    legend.appendChild(item);
  });
  wrap.appendChild(legend);
}

// ── History ────────────────────────────────────────
function renderHistory() {
  const list = document.getElementById('history-list');
  while (list.firstChild) list.removeChild(list.firstChild);

  const sorted = [...readings].sort((a, b) => b.datetime.localeCompare(a.datetime));

  if (!sorted.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'No readings yet';
    list.appendChild(empty);
    return;
  }

  sorted.forEach(r => {
    const cls = classify(r.systolic, r.diastolic);
    const row = document.createElement('div');
    row.className = 'hist-row';
    row.style.borderLeftColor = cls.color;

    const main = document.createElement('div');
    main.className = 'hist-main';

    const dt = document.createElement('div');
    dt.className = 'hist-datetime';
    dt.textContent = fmtDatetime(r.datetime);

    const vals = document.createElement('div');
    vals.className = 'hist-values';
    const sysSpan = document.createElement('span');
    sysSpan.style.color = '#c0392b';
    sysSpan.textContent = String(r.systolic);
    const sep1 = document.createTextNode('/');
    const diaSpan = document.createElement('span');
    diaSpan.style.color = '#2980b9';
    diaSpan.textContent = String(r.diastolic);
    const sep2 = document.createTextNode(' mmHg');
    vals.appendChild(sysSpan);
    vals.appendChild(sep1);
    vals.appendChild(diaSpan);
    vals.appendChild(sep2);
    if (r.heartRate) {
      const hrSep = document.createTextNode(' · ');
      const hrSpan = document.createElement('span');
      hrSpan.style.color = '#4a7c59';
      hrSpan.textContent = `${r.heartRate} bpm`;
      vals.appendChild(hrSep);
      vals.appendChild(hrSpan);
    }

    const badge = document.createElement('span');
    badge.className = 'card-badge';
    badge.style.color = cls.color;
    badge.style.borderColor = cls.color;
    badge.textContent = cls.label;

    const del = document.createElement('button');
    del.className = 'hist-delete';
    del.textContent = '×';
    del.title = 'Delete reading';
    del.addEventListener('click', () => deleteReading(r.id));

    main.appendChild(dt);
    main.appendChild(vals);
    main.appendChild(badge);
    main.appendChild(del);
    row.appendChild(main);

    if (r.notes && r.notes.trim()) {
      const notes = document.createElement('div');
      notes.className = 'hist-notes';
      notes.textContent = r.notes.trim();
      row.appendChild(notes);
    }

    list.appendChild(row);
  });
}

// ── Report ─────────────────────────────────────────
function renderReport() {
  const content = document.getElementById('report-content');
  while (content.firstChild) content.removeChild(content.firstChild);

  const periods = [
    { label: 'Last 7 days',  days: 7 },
    { label: 'Last 30 days', days: 30 },
    { label: 'All time',     days: null }
  ];

  periods.forEach(({ label, days }) => {
    const rs = days ? readingsForRange(String(days)) : readings;
    const stats = computeStats(rs);

    const section = document.createElement('div');
    section.className = 'report-section';

    const lbl = document.createElement('div');
    lbl.className = 'report-label';
    lbl.textContent = label;
    section.appendChild(lbl);

    if (!stats) {
      const empty = document.createElement('div');
      empty.className = 'report-empty';
      empty.textContent = 'No readings in this period';
      section.appendChild(empty);
      content.appendChild(section);
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'report-grid';

    const cells = [
      { label: 'Count',   value: String(stats.count) },
      { label: 'Avg HR',  value: stats.avgHr ? `${stats.avgHr} bpm` : '—' },
      { label: 'Avg SYS', value: `${stats.avgSys}`, color: '#c0392b' },
      { label: 'Avg DIA', value: `${stats.avgDia}`, color: '#2980b9' },
      { label: 'Min SYS', value: `${stats.minSys}`, color: '#c0392b' },
      { label: 'Max SYS', value: `${stats.maxSys}`, color: '#c0392b' },
      { label: 'Min DIA', value: `${stats.minDia}`, color: '#2980b9' },
      { label: 'Max DIA', value: `${stats.maxDia}`, color: '#2980b9' }
    ];

    cells.forEach(({ label: cl, value, color }) => {
      const cell = document.createElement('div');
      cell.className = 'report-cell';
      const lblEl = document.createElement('div');
      lblEl.className = 'report-cell-lbl';
      lblEl.textContent = cl;
      const valEl = document.createElement('div');
      valEl.className = 'report-cell-val';
      if (color) valEl.style.color = color;
      valEl.textContent = value;
      cell.appendChild(lblEl);
      cell.appendChild(valEl);
      grid.appendChild(cell);
    });

    section.appendChild(grid);
    content.appendChild(section);
  });

  // Export CSV
  const exportBtn = document.createElement('button');
  exportBtn.className = 'export-btn';
  exportBtn.textContent = 'Export CSV';
  exportBtn.addEventListener('click', exportCSV);
  content.appendChild(exportBtn);
}

function exportCSV() {
  const headers = ['Date', 'Time', 'Systolic', 'Diastolic', 'HeartRate', 'Notes'];
  const rows = readings.map(r => {
    const [date, time] = r.datetime.split('T');
    return [date, time || '', r.systolic, r.diastolic, r.heartRate || '', (r.notes || '').replace(/,/g, ' ')];
  });
  const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `bp-export-${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── Entry form ─────────────────────────────────────
function resetForm() {
  document.getElementById('inp-datetime').value = nowIso();
  document.getElementById('inp-sys').value = '';
  document.getElementById('inp-dia').value = '';
  document.getElementById('inp-hr').value = '';
  document.getElementById('inp-notes').value = '';
  document.getElementById('form-error').textContent = '';
  document.getElementById('inp-sys').classList.remove('error');
  document.getElementById('inp-dia').classList.remove('error');
}

document.getElementById('inp-datetime').value = nowIso();

document.getElementById('save-btn').addEventListener('click', () => {
  const dt  = document.getElementById('inp-datetime').value;
  const sys = parseInt(document.getElementById('inp-sys').value);
  const dia = parseInt(document.getElementById('inp-dia').value);
  const hr  = parseInt(document.getElementById('inp-hr').value);
  const notes = document.getElementById('inp-notes').value.trim();

  // Validate
  let hasError = false;
  document.getElementById('form-error').textContent = '';
  document.getElementById('inp-sys').classList.remove('error');
  document.getElementById('inp-dia').classList.remove('error');

  if (!document.getElementById('inp-sys').value || isNaN(sys) || sys < 60 || sys > 250) {
    document.getElementById('inp-sys').classList.add('error');
    hasError = true;
  }
  if (!document.getElementById('inp-dia').value || isNaN(dia) || dia < 40 || dia > 150) {
    document.getElementById('inp-dia').classList.add('error');
    hasError = true;
  }
  if (hasError) {
    document.getElementById('form-error').textContent = 'Systolic and diastolic are required.';
    return;
  }

  const reading = {
    id:        String(Date.now()),
    datetime:  dt || nowIso(),
    systolic:  sys,
    diastolic: dia,
    heartRate: (!document.getElementById('inp-hr').value || isNaN(hr)) ? null : hr,
    notes:     notes
  };

  readings.push(reading);
  readings.sort((a, b) => a.datetime.localeCompare(b.datetime));
  saveLocal();
  scheduleSave();

  resetForm();

  // Show "saved ✓" briefly in button
  const btn = document.getElementById('save-btn');
  btn.textContent = 'saved ✓';
  btn.style.background = '#4a7c59';
  setTimeout(() => {
    btn.textContent = 'Save reading';
    btn.style.background = '';
  }, 1800);

  render();
});

function deleteReading(id) {
  readings = readings.filter(r => r.id !== id);
  saveLocal();
  scheduleSave();
  render();
}

// ── Tabs ───────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById(`tab-${tab}`).classList.add('active');
    activeTab = tab;
    render();
  });
});

// ── Range toggle ───────────────────────────────────
document.querySelectorAll('.range-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeRange = btn.dataset.range;
    renderGraph();
  });
});

// ── Init ──────────────────────────────────────────
if (!getPat()) showPat(); else loadData();
</script>
